/* ---------- 噪声 ---------- */
function hash(x, y, s = 0) {

function vnoise(x, y, s = 0) {

const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------- 浮点画布：纸 + 太阳 + 远山 ---------- */
const N = Wd * Ht;
const R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N), PR = new Float32Array(N), PG = new Float32Array(N), PB = new Float32Array(N);
for (let y = 0; y < Ht; y++) for (let x = 0; x < Wd; x++) {

// 朱红太阳
{
  const sx = 372, sy = 548, sr = 150;
  for (let y = sy - sr - 8; y < sy + sr + 8; y++) for (let x = sx - sr - 8; x < sx + sr + 8; x++) {
    const d = Math.hypot(x - sx, y - sy), ang = Math.atan2(y - sy, x - sx);

}
// 山：一层一层从远到近，山脚是雾（纸色）挡住后面的山
function ridgeOf(peaks, base, rough, s, freq = 0.006) {
  const r = new Float32Array(Wd);
  for (let x = 0; x < Wd; x++) {
    let y = base;
    for (const [c, h, w, p] of peaks) { const t = Math.abs(x - c) / w; y -= h / (1 + Math.pow(t, p || 2)); }
    y += rough * (fbm(x * freq, s, 5, s) - 0.5) * 2 + rough * 0.25 * (fbm(x * freq * 5, s + 3, 3, s) - 0.5);

}

/* ---------- 毛笔笔触 ---------- */
function brush(c, pts, w0, w1, ink = [26, 25, 22], alpha = 0.85, dry = 0.25) {

  const offs = []; for (let k = 0; k < bristles; k++) offs.push([(rnd() - 0.5) * 2, 0.45 + rnd() * 0.55, rnd()]);
  let j = 1;
  for (let s = 0; s <= total; s += 0.9) {

    const ax = pts[j - 1][0], ay = pts[j - 1][1], bx = pts[j][0], by = pts[j][1];
    const x = ax + (bx - ax) * t, y = ay + (by - ay) * t;
    const len = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / len, ny = (bx - ax) / len;

      c.beginPath(); c.arc(x + nx * o * w * 0.5, y + ny * o * w * 0.5, Math.max(0.5, w * 0.16 * sz), 0, 7); c.fill();

function wobble(pts, amp = 1.2, f = 0.05, s = 0) { return pts.map(([x, y], i) => [x + (vnoise(i * f, s) - 0.5) * amp * 2, y + (vnoise(i * f, s + 7) - 0.5) * amp * 2]); }

/* ---------- 赵州桥（立面） ---------- */
const WL = 1246;                // 水面 / 拱脚

{

  for (const s of smalls) { c.moveTo(s.x + s.r, s.yb); c.arc(s.x, s.yb, s.r, 0, Math.PI, true); c.closePath(); }

  for (let k = 0; k < 220; k++) { const x = 172 + rnd() * 736, y = 1110 + Math.floor(rnd() * 12) * 11; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 11); c.stroke(); }
  c.restore();

  const under = []; for (let x = 172; x <= 908; x += 6) under.push([x, deckY(x) + 12]);

    c.beginPath(); c.ellipse(px - 22, py - 11, 6, 4.5, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(px + 22, py - 13, 6, 4.5, 0, 0, 7); c.fill();
    // 斗笠
