:root {

  padding: 12px max(16px, var(--sar)) 12px max(16px, var(--sal)); font-family: var(--px); font-size: 12px; line-height: 1.5; color: var(--white);
  overflow-y: auto; touch-action: pan-y; }
.scr[hidden] { display: none !important; }
b { font-weight: normal; color: var(--gold2); }
b.b { color: var(--blue); } b.r { color: var(--red); } b.g { color: var(--gold); }
.btn { font: inherit; font-size: 24px; line-height: 1; padding: 9px 22px; color: var(--ink); background: var(--gold); border: 0; border-radius: 0; cursor: pointer;
  box-shadow: 0 0 0 3px var(--ink), inset -3px -3px 0 var(--gold3), inset 3px 3px 0 var(--gold2); touch-action: manipulation; }
.btn:active { transform: translateY(2px); }
.btn:focus-visible, .card:focus-visible, .it:focus-visible, .seg button:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
.btn.big { padding: 12px 30px; }
.btn.sm { font-size: 12px; padding: 8px 14px; background: #3A3048; color: var(--white); box-shadow: 0 0 0 3px var(--ink), inset -3px -3px 0 #2A2236, inset 3px 3px 0 #5E5272; }
.btn.red { background: #9A2E2E; color: var(--white); box-shadow: 0 0 0 3px var(--ink), inset -3px -3px 0 #6E1E1E, inset 3px 3px 0 #C85050; }
.btn:disabled { filter: grayscale(1) brightness(0.7); cursor: default; }
.row { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
.hd { font-size: 24px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: center; }
.hd small { font-size: 12px; color: var(--dim); text-shadow: none; }
.box { background: var(--panel); box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px #3A3048; padding: 14px 18px; max-width: 640px; display: flex; flex-direction: column; gap: 10px; align-items: center; box-sizing: border-box; }
.box.wide { max-width: 860px; width: 100%; }
.box p { margin: 0; max-width: 60ch; }
.credit { font-size: 12px; color: var(--dim); text-align: center; }
/* 开头 */
#boot { background: var(--bg); }
#title { background: linear-gradient(rgba(14,11,22,0.1), rgba(14,11,22,0.5) 60%, rgba(14,11,22,0.8)); justify-content: space-between; }
.logo { text-align: center; margin-top: 4px; }
.logo .l1 { font-size: 48px; line-height: 1.1; color: var(--gold); letter-spacing: 6px;
  text-shadow: 3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink), 3px 3px var(--ink), -3px 3px var(--ink), 3px -3px var(--ink), -3px -3px var(--ink), 0 6px #6E3E0E, 3px 6px #6E3E0E, -3px 6px #6E3E0E; }
.logo .l2 { font-size: 12px; color: var(--white); margin-top: 8px; letter-spacing: 2px; text-shadow: 2px 2px 0 var(--ink); }
.menu { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.seg { display: flex; gap: 0; box-shadow: 0 0 0 3px var(--ink); }

.seg button.on { background: var(--gold); color: var(--ink); }
.rec { color: var(--gold2); min-height: 18px; text-shadow: 2px 2px 0 var(--ink); }

#select { background: radial-gradient(ellipse at 50% 35%, rgba(42,34,64,0.88), rgba(14,11,22,0.96)); gap: 10px; }
.selwrap { display: flex; gap: 16px; align-items: stretch; justify-content: center; width: 100%; max-width: 860px; flex-wrap: wrap; }
.cards { display: grid; grid-template-columns: repeat(3, 84px); gap: 8px; align-content: start; }
.card { font: inherit; font-size: 12px; color: var(--white); background: var(--panel2); border: 0; border-radius: 0; padding: 4px 2px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 0; box-shadow: 0 0 0 3px var(--ink); }
.card img { width: 104px; height: 72px; margin: -6px 0 -8px; image-rendering: pixelated; }

.card.on { background: #4A3A18; box-shadow: 0 0 0 3px var(--gold); }
.detail { flex: 1 1 300px; min-width: 0; max-width: 460px; background: var(--panel); box-shadow: 0 0 0 3px var(--ink); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.dtop { display: flex; gap: 10px; align-items: center; }
.dtop img { width: 156px; height: 108px; image-rendering: pixelated; margin: -14px -18px -18px -14px; }
.dn { font-size: 24px; color: var(--gold); line-height: 1.1; } .dn span { font-size: 12px; color: var(--dim); }
.pas { color: var(--white); }
.sk { display: flex; gap: 8px; align-items: flex-start; }
.sk img { width: 36px; height: 36px; image-rendering: pixelated; flex: none; background: #241C2E; box-shadow: 0 0 0 2px var(--ink); }
/* 对阵 */
#vs { background: linear-gradient(180deg, #13284E, #0E0B16 48%, #0E0B16 52%, #4E1616); gap: 6px; }
.vsrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vsh { display: flex; flex-direction: column; align-items: center; width: 82px; padding: 0 0 6px; background: rgba(0,0,0,0.35); box-shadow: 0 0 0 3px var(--ink); }

.vsh small { color: var(--dim); font-size: 12px; }
.vsmid { display: flex; gap: 24px; align-items: center; font-size: 24px; }
.vsmid b { font-size: 48px; color: var(--gold); text-shadow: 3px 3px 0 var(--ink); }
.vb { color: var(--blue); } .vr { color: var(--red); }
.load { display: flex; gap: 10px; align-items: center; }
.bar { width: 220px; height: 12px; background: #241C2E; box-shadow: 0 0 0 3px var(--ink); }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); }

#pause, #result, #shop, #help { background: rgba(10,8,18,0.72); justify-content: flex-start; }
#pause > .box, #result > .box, #shop > .box, #help > .box { margin: auto 0; }
.board { border-collapse: collapse; width: 100%; font-size: 12px; }
.board th { color: var(--dim); font-weight: normal; text-align: left; padding: 0 6px 4px; }
.board td { padding: 0 6px; white-space: nowrap; line-height: 20px; }

.board tr.gap td { height: 6px; padding: 0; }

.board td.its img { width: 18px; height: 18px; margin-right: 2px; object-fit: contain; }

.shopbox { max-width: 860px; }

.cat { color: var(--dim); margin: 4px 0 2px; }

  { k: [600, 3480, 1060, 3560, 95] },       // 基地上边那道墙（对抗路出口和中路出口之间）
];
function mapShapes(list) {
  const out = [];
  const add = (s, f) => {
    if (s.c) { const p = f([s.c[0], s.c[1]]); out.push({ c: [p[0], p[1], s.c[2]] }); }
    else { const a = f([s.k[0], s.k[1]]), b = f([s.k[2], s.k[3]]); out.push({ k: [a[0], a[1], b[0], b[1], s.k[4]] }); }
  };
  for (const s of list) {
    add(s, p => p); add(s, swapLane); add(s, mir); add(s, p => mir(swapLane(p)));
  }
  return out;
}
const WALLS = (() => {
  const w = mapShapes(Q_WALLS);
  for (const s of BASE_WALLS) {               // 基地墙：蓝方上下两道 + 红方两道
    const k = s.k;
    for (const f of [p => p, swapLane, mir, p => mir(swapLane(p))]) {
      const a = f([k[0], k[1]]), b = f([k[2], k[3]]);
      w.push({ k: [a[0], a[1], b[0], b[1], k[4]] });
    }
  }
  return w;
})();
const BUSHES = mapShapes(Q_BUSH);
const BORDER = 150;                            // 地图四周一圈是墙

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + t * dx - px, qy = ay + t * dy - py;
  return Math.sqrt(qx * qx + qy * qy);
}
function shapeDist(s, x, y) {               // 到形状边缘的距离（里面是负数）
  if (s.c) return Math.hypot(x - s.c[0], y - s.c[1]) - s.c[2];
  return segDist(x, y, s.k[0], s.k[1], s.k[2], s.k[3]) - s.k[4];
}
function wallDist(x, y) {
  let d = Math.min(x - BORDER, y - BORDER, L - BORDER - x, L - BORDER - y);
  for (const s of WALLS) { const v = shapeDist(s, x, y); if (v < d) d = v; }
  return d;
}
function bushAt(x, y) {                       // 在第几个草丛里（从 1 起），不在就是 0
  for (let i = 0; i < BUSHES.length; i++) if (shapeDist(BUSHES[i], x, y) < 0) return i + 1;
  return 0;
}

/* ---------- 随机数（种子存在 W.seed 里，存档后接着算） ---------- */
function rnd(W) {
  let a = (W.seed = (W.seed + 0x6D2B79F5) | 0);
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

    if (px < -60 || py < -80 || px > R.bw + 60 || py > R.bh + 60) continue;

/* ---------- 缓存的小图 ---------- */
function discImg(r, fill, edge, alpha) {

  const c = mkc(r * 2 + 1, r * 2 + 1), g = c.getContext('2d');
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    const d = Math.hypot(x, y);
    if (d > r + 0.3) continue;
    g.globalAlpha = d > r - 1.2 ? 1 : alpha;
    g.fillStyle = d > r - 1.2 ? edge : fill;
    g.fillRect(x + r, y + r, 1, 1);
  }
  SH[key] = c;
  return c;
}
function pieImg(r, frac) {                    // 冷却的扇形遮罩
  const q = Math.round(frac * 24);

  if (SH[key]) return SH[key];
  const c = mkc(r * 2 + 1, r * 2 + 1), g = c.getContext('2d');
  g.fillStyle = 'rgba(8,6,14,0.72)';
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    if (Math.hypot(x, y) > r - 1) continue;
    let a = Math.atan2(x, -y); if (a < 0) a += Math.PI * 2;

  return c;
}

  const key = 'gray' + (img._k || (img._k = Math.random().toString(36).slice(2)));

  const c = mkc(img.width, img.height), g = c.getContext('2d');
  g.drawImage(img, 0, 0);

}

/* ===== input.js ===== */
'use strict';
/* input.js：触屏（多指）和键盘鼠标。
   左半屏按下 = 摇杆（按在哪儿摇杆就出现在哪儿）；按住普攻键自动打范围里的目标；
   技能键：点一下自动瞄最近的敌方英雄，按住拖动 = 自己瞄（方向 / 落点），拖到“取消”上松手不放；闪现同理。
   键盘：WASD / 方向键移动，J / 空格普攻，1 2 3（或 Q E R）技能朝鼠标放，F 闪现，H 恢复，B 回城，P / Esc 暂停。 */

const INP = { ptr: {}, joy: null, atk: null, aim: null, keys: {}, keyAtk: false, mouse: null, mouseT: -9, peek: null, onPause: null, onShop: null, onAuto: null };
const JOY_DEAD = 4;

function inpReset() { INP.ptr = {}; INP.joy = null; INP.atk = null; INP.aim = null; INP.keyAtk = false; INP.keys = {}; R.peek = null; }
function hitBtn(b, x, y, pad) { return Math.hypot(x - b.x, y - b.y) <= b.r + (pad || 5); }

function onPointerDown(W, me, id, x, y) {
  const Lt = HUD.L || hudLayout();
  const m = Lt.mini;
  if (x >= m.x && y >= m.y && x < m.x + m.s && y < m.y + m.s) { INP.ptr[id] = { role: 'mini' }; miniPeek(x, y); return; }
  if (hitBtn(Lt.pause, x, y, 6)) { INP.onPause && INP.onPause(); return; }
  if (hitBtn(Lt.auto, x, y, 6)) { INP.onAuto && INP.onAuto(); return; }
  if (hitBtn(Lt.rally, x, y, 6)) { callRally(W, me); return; }
  const s = Lt.shop;
  if (x >= s.x - 4 && y >= s.y - 4 && x < s.x + s.w + 4 && y < s.y + s.h + 4) { INP.onShop && INP.onShop(); return; }
  if (hitBtn(Lt.buy, x, y, 5) && HUD.nb) { if (!buy(W, me, HUD.nb)) toast('金币不够', C.dim); return; }
  if (me.dead) { if (x < R.bw * 0.5) startJoy(id, x, y); return; }
  if (hitBtn(Lt.atk, x, y, 7)) { INP.atk = id; INP.ptr[id] = { role: 'atk' }; return; }
  for (let s2 = 0; s2 < 3; s2++) {
    if (hitBtn(Lt.s[s2], x, y, 6)) {
      const st = me.sk[s2];
      if (!st.rank) { toast(s2 === 2 ? '4 级解锁大招' : '2 级解锁', C.dim); return; }
      if (st.cd > 0) { toast('技能冷却中', C.dim); return; }
      INP.aim = { id, s: s2, x0: Lt.s[s2].x, y0: Lt.s[s2].y, px: 0, py: 0, dx: me.face, dy: 0, mag: 0.6, moved: false, cancel: false };
      INP.ptr[id] = { role: 'aim' };
      return;
    }
  }
  if (hitBtn(Lt.flash, x, y, 6)) {
    if (me.flashCd > 0) { toast('闪现冷却中', C.dim); return; }
    INP.aim = { id, s: 'flash', kind: 'flash', x0: Lt.flash.x, y0: Lt.flash.y, px: 0, py: 0, dx: me.face, dy: 0, mag: 1, moved: false, cancel: false };
    INP.ptr[id] = { role: 'aim' };
    return;
  }
  if (hitBtn(Lt.heal, x, y, 5)) { if (me.healCd > 0) toast('恢复冷却中', C.dim); else me.cmd.heal = true; return; }
  if (hitBtn(Lt.recall, x, y, 5)) { me.cmd.recall = true; return; }
  if (x < R.bw * 0.5 && !INP.joy) { startJoy(id, x, y); return; }
}
// 集合：队友过来跟着你，你打什么他们帮着打（25 秒，冷却 20 秒）
function callRally(W, me) {
  if (me.dead) return;
  if (W.rallyCd && W.t < W.rallyCd) { toast('集合冷却中', C.dim); return; }
  W.rally = { team: me.team, id: me.id, until: W.t + 25 };
  W.rallyCd = W.t + 20;
  announce('请求集合', C.blue, { dur: 1.6, sub: '队友正在赶过来，跟着你打' });
  sfx('wave');
}
function startJoy(id, x, y) {
  const J = (HUD.L || hudLayout()).joy;
  const bx0 = clamp(x, J.r + 4 + INS.l, R.bw * 0.5), by0 = clamp(y, 80, R.bh - J.r - 4 - INS.b);
  INP.joy = { id, bx: bx0, by: by0, x, y };
  INP.ptr[id] = { role: 'joy' };
  moveJoy(x, y);
}
function moveJoy(x, y) {
  const j = INP.joy, J = (HUD.L || hudLayout()).joy;
  let dx = x - j.bx, dy = y - j.by, d = Math.hypot(dx, dy);
  if (d > J.r) { // 拖出圈外：底座跟着手指走
    j.bx += dx / d * (d - J.r); j.by += dy / d * (d - J.r);
    dx = x - j.bx; dy = y - j.by; d = J.r;
  }
  j.x = j.bx + dx; j.y = j.by + dy;
}
function miniPeek(x, y) {
  const m = (HUD.L || hudLayout()).mini;
  R.peek = [clamp((x - m.x) / m.s * L, 0, L), clamp((y - m.y) / m.s * L, 0, L)];
}
function onPointerMove(W, me, id, x, y) {
  const p = INP.ptr[id];
  if (!p) return;
  if (p.role === 'joy' && INP.joy && INP.joy.id === id) moveJoy(x, y);
  else if (p.role === 'mini') miniPeek(x, y);
  else if (p.role === 'aim' && INP.aim && INP.aim.id === id) {
    const a = INP.aim, px = x - a.x0, py = y - a.y0, d = Math.hypot(px, py);
    a.px = px; a.py = py;
    if (d > JOY_DEAD) { a.moved = true; a.dx = px / d; a.dy = py / d; a.mag = Math.min(1, d / 30); }
    a.cancel = a.moved && hitBtn((HUD.L || hudLayout()).cancel, x, y, 4);
  }
}
function onPointerUp(W, me, id, x, y) {
  const p = INP.ptr[id];
  delete INP.ptr[id];
  if (!p) return;
  if (p.role === 'joy' && INP.joy && INP.joy.id === id) INP.joy = null;
  else if (p.role === 'atk' && INP.atk === id) INP.atk = null;
  else if (p.role === 'mini') R.peek = null;
  else if (p.role === 'aim' && INP.aim && INP.aim.id === id) {
    const a = INP.aim; INP.aim = null;
    if (a.cancel || me.dead) return;
    if (a.s === 'flash') {
      const [dx, dy] = a.moved ? [a.dx, a.dy] : joyDir(me);
      me.cmd.flash = [me.x + dx * 100, me.y + dy * 100];
      return;
    }
    if (a.moved) castAimed(W, me, a.s, a.dx, a.dy, a.mag);
    else smartCast(W, me, a.s);
  }
}
function joyDir(me) {
  const v = moveVec();
  if (v) return v;
  return [me.face, 0];
}
function castAimed(W, me, s, dx, dy, mag) {
  const def = sdef(me, s);
  if (def.aim === 'point') me.cmd.cast = { s, x: me.x + dx * mag * def.range, y: me.y + dy * mag * def.range };
  else if (def.aim === 'dir') me.cmd.cast = { s, x: me.x + dx * 300, y: me.y + dy * 300 };
  else if (def.aim === 'unit') {
    // 朝拖的方向挑最近的敌方英雄
    let best = null, bs = 1e9;
    for (const e of W._heroes) {
      if (e.team === me.team || e.dead || !canSee(W, me.team, e)) continue;
      const ex = e.x - me.x, ey = e.y - me.y, d = Math.hypot(ex, ey);
      if (d > def.range + 80) continue;
      const ang = Math.acos(clamp((ex * dx + ey * dy) / (d || 1), -1, 1));
      const sc = ang * 400 + d;
      if (sc < bs) { bs = sc; best = e; }
    }
    me.cmd.cast = { s, id: best ? best.id : 0 };
  } else me.cmd.cast = { s };
}
// 点一下：自动找目标
function smartCast(W, me, s) {
  const def = sdef(me, s);
  if (def.aim === 'self') { me.cmd.cast = { s }; return; }
  const reach = def.aim === 'unit' ? def.range + 80 : Math.min(def.range, 1100) + (def.aim === 'point' ? (def.rad || 100) * 0.6 : 60);
  let tgt = null, bd = 1e9;
  for (const e of W._heroes) {
    if (e.team === me.team || e.dead || !canSee(W, me.team, e) || untarg(e)) continue;
    const d = dist(me, e);
    if (d < reach && d < bd) { bd = d; tgt = e; }
  }
  if (!tgt && def.aim !== 'unit') {
    near(W, me.x, me.y, Math.min(reach, 700), u => {
      if ((u.kind === 'minion' || u.kind === 'monster') && u.team !== me.team && !u.dead && !u.reset) { const d = dist(me, u); if (d < bd) { bd = d; tgt = u; } }
    });
  }
  if (def.aim === 'unit') { if (!tgt) { toast('附近没有敌方英雄', C.dim); return; } me.cmd.cast = { s, id: tgt.id }; return; }
  if (tgt) {
    const lead = tgt.kind === 'hero' ? 0.25 : 0;
    me.cmd.cast = { s, x: tgt.x + (tgt.vx || 0) * lead, y: tgt.y + (tgt.vy || 0) * lead };
    return;
  }
  const [dx, dy] = joyDir(me);
  const r = def.aim === 'point' ? def.range * 0.6 : 300;
  me.cmd.cast = { s, x: me.x + dx * r, y: me.y + dy * r };
}
function moveVec() {
  if (INP.joy) {
    const j = INP.joy, dx = j.x - j.bx, dy = j.y - j.by, d = Math.hypot(dx, dy);
    if (d > JOY_DEAD) return [dx / d, dy / d];
    return null;
  }
  const k = INP.keys;
  let x = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0), y = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
  if (!x && !y) return null;
  const d = Math.hypot(x, y);
  return [x / d, y / d];
}
// 每帧：把摇杆、普攻键写进玩家的指令
function playerCmd(W, me) {
  const c = me.cmd || (me.cmd = {});
  if (W.auto) return;
  c.mv = moveVec();
  c.atkAuto = INP.atk != null || INP.keyAtk;
  c.goto = null; c.atk = 0;
}
// 键盘
function mouseWorld(me) {
  if (!INP.mouse || R.t - INP.mouseT > 4) return null;
  return bufToWorld(INP.mouse[0], INP.mouse[1]);
}
function onKey(W, me, code, down) {
  if (down) HUD.keyboard = true;
  INP.keys[code] = down;
  if (code === 'KeyJ' || code === 'Space') INP.keyAtk = down;
  if (!down || !me || me.dead) return;
  const sk = { Digit1: 0, KeyQ: 0, KeyU: 0, Digit2: 1, KeyE: 1, KeyI: 1, Digit3: 2, KeyR: 2, KeyO: 2 }[code];
  if (sk != null) {
    const st = me.sk[sk];
    if (!st.rank || st.cd > 0) return;
    const mw = mouseWorld(me);
    if (mw) {
      const def = sdef(me, sk), dx = mw[0] - me.x, dy = mw[1] - me.y, d = Math.hypot(dx, dy) || 1;
      castAimed(W, me, sk, dx / d, dy / d, Math.min(1, d / (def.range || 1)));
    } else smartCast(W, me, sk);
    return;
  }
  if (code === 'KeyF') {
    const mw = mouseWorld(me);
    me.cmd.flash = mw ? [mw[0], mw[1]] : (() => { const [dx, dy] = joyDir(me); return [me.x + dx * 100, me.y + dy * 100]; })();
  }
  if (code === 'KeyH' || code === 'KeyC') me.cmd.heal = true;
  if (code === 'KeyB') me.cmd.recall = true;
  if (code === 'KeyG') callRally(W, me);
}

/* ===== audio.js ===== */
'use strict';
/* audio.js：音效全部用 WebAudio 现场合成（8 位游戏风），离镜头越远越小声；播报语音是 CosyVoice 3 合成的小 mp3（build 时嵌进来，VOICE 里是 base64）。
   浏览器要求先点一下才能出声：点“开始”时调用 audioInit()。 */

const AU = { ctx: null, master: null, sfxBus: null, voiceBus: null, on: true, noise: null, voices: {}, last: {}, playing: null, queue: [], camX: 0, camY: 0 };

function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  AU.ctx = ctx;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  AU.master = ctx.createGain(); AU.master.gain.value = AU.on ? 0.9 : 0;
  AU.master.connect(comp); comp.connect(ctx.destination);
  AU.sfxBus = ctx.createGain(); AU.sfxBus.gain.value = 0.55; AU.sfxBus.connect(AU.master);
  AU.voiceBus = ctx.createGain(); AU.voiceBus.gain.value = 1.0; AU.voiceBus.connect(AU.master);
  const n = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = n;
  if (typeof VOICE !== 'undefined') {
    for (const id in VOICE) {
      try {
        const bin = atob(VOICE[id]), buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        ctx.decodeAudioData(buf.buffer, b => { AU.voices[id] = b; }, () => {});
      } catch (e) { /* 解不开就没有这句语音，画面上的字照常出 */ }
    }
  }
  if (ctx.state === 'suspended') ctx.resume();
}
// 环境声：一层很轻的风（低通噪声，慢慢起伏），隔几秒一声鸟叫。没有配乐
function ambientStart() {
  if (!AU.ctx || AU.amb) return;
  const c = AU.ctx;
  const src = c.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 480;
  const g = c.createGain(); g.gain.value = 0.05;
  const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.11; lg.gain.value = 0.03;
  lfo.connect(lg); lg.connect(g.gain);
  src.connect(f); f.connect(g); g.connect(AU.master);
  src.start(); lfo.start();
  AU.amb = { src, g, lfo }; AU.birdT = 2;
}
function ambientTick(dt) {
  if (!AU.amb || !AU.on) return;
  AU.birdT -= dt;
  if (AU.birdT > 0) return;
  AU.birdT = 3 + Math.random() * 7;
  const t = AU.ctx.currentTime, n = 2 + Math.floor(Math.random() * 3), f0 = 2300 + Math.random() * 1200;
  for (let i = 0; i < n; i++) osc('sine', f0, f0 * 1.35, t + i * 0.09, 0.06, 0.035, AU.master);
}
function setSound(on) {
  AU.on = on;
  if (AU.master) AU.master.gain.setTargetAtTime(on ? 0.9 : 0, AU.ctx.currentTime, 0.05);
}

/* ---------- 合成的小零件 ---------- */
function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function osc(type, f0, f1, t, dur, vol, out) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  env(g, t, 0.005, vol, dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
}
function noise(t, dur, vol, ftype, f0, f1, q, out) {
  const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; s.loop = true;
  f.type = ftype; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
  env(g, t, 0.004, vol, dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const SYN = {
  swing(t, v, o) { noise(t, 0.12, 0.5 * v, 'bandpass', 900, 3200, 2, o); },
  hit(t, v, o) { noise(t, 0.06, 0.6 * v, 'lowpass', 1600, 400, 1, o); osc('sine', 160, 70, t, 0.08, 0.5 * v, o); },
  shoot(t, v, o) { osc('triangle', 950, 420, t, 0.07, 0.35 * v, o); noise(t, 0.04, 0.2 * v, 'highpass', 3000, 3000, 1, o); },
  magic(t, v, o) { osc('sine', 620, 1250, t, 0.14, 0.3 * v, o); osc('triangle', 930, 1870, t, 0.1, 0.12 * v, o); },
  heart(t, v, o) { osc('sine', 880, 880, t, 0.1, 0.25 * v, o); osc('sine', 1320, 1320, t + 0.05, 0.1, 0.2 * v, o); },
  tower(t, v, o) { osc('square', 320, 90, t, 0.22, 0.22 * v, o); noise(t, 0.15, 0.25 * v, 'lowpass', 2400, 300, 1, o); },
  boom(t, v, o) { noise(t, 0.55, 0.9 * v, 'lowpass', 2200, 120, 1, o); osc('sine', 110, 40, t, 0.4, 0.6 * v, o); },
  fire(t, v, o) { noise(t, 0.3, 0.35 * v, 'bandpass', 700, 300, 1.5, o); osc('sine', 260, 120, t, 0.25, 0.25 * v, o); },
  ice(t, v, o) { for (const [f, d] of [[1760, 0], [2349, 0.04], [2637, 0.08], [3520, 0.12]]) osc('sine', f, f * 0.98, t + d, 0.25, 0.12 * v, o); noise(t, 0.3, 0.2 * v, 'highpass', 5000, 5000, 1, o); },
  dash(t, v, o) { noise(t, 0.22, 0.45 * v, 'bandpass', 400, 2400, 1.2, o); },
  stun(t, v, o) { osc('sine', 900, 280, t, 0.16, 0.4 * v, o); osc('square', 1400, 1400, t + 0.02, 0.04, 0.1 * v, o); },
  heal(t, v, o) { [523, 659, 784].forEach((f, i) => osc('sine', f, f, t + i * 0.06, 0.18, 0.18 * v, o)); },
  shield(t, v, o) { osc('sine', 440, 660, t, 0.35, 0.22 * v, o); osc('sine', 660, 990, t, 0.35, 0.12 * v, o); },
  coin(t, v, o) { osc('square', 988, 988, t, 0.05, 0.12 * v, o); osc('square', 1319, 1319, t + 0.055, 0.12, 0.12 * v, o); },
  levelup(t, v, o) { [523, 659, 784, 1047].forEach((f, i) => osc('square', f, f, t + i * 0.07, 0.1, 0.13 * v, o)); },
  kill(t, v, o) { [220, 277, 330].forEach(f => osc('sawtooth', f, f * 0.98, t, 0.35, 0.09 * v, o)); noise(t, 0.2, 0.3 * v, 'lowpass', 3000, 300, 1, o); },
  death(t, v, o) { osc('square', 420, 90, t, 0.5, 0.16 * v, o); },
  pop(t, v, o) { osc('square', 600, 200, t, 0.06, 0.12 * v, o); },
  click(t, v, o) { osc('square', 1200, 1200, t, 0.03, 0.12 * v, o); },
  recall(t, v, o) { osc('sine', 300, 900, t, 1.2, 0.12 * v, o); osc('sine', 450, 1350, t + 0.1, 1.1, 0.06 * v, o); },
  flash(t, v, o) { noise(t, 0.15, 0.4 * v, 'highpass', 2500, 6000, 1, o); osc('sine', 2200, 500, t, 0.12, 0.2 * v, o); },
  meteor(t, v, o) { osc('sine', 1800, 300, t, 0.45, 0.12 * v, o); },
  big(t, v, o) { noise(t, 0.5, 0.6 * v, 'bandpass', 300, 3000, 1, o); osc('sawtooth', 110, 55, t, 0.4, 0.15 * v, o); },
  crumble(t, v, o) { noise(t, 1.1, 0.8 * v, 'lowpass', 1800, 100, 0.8, o); for (let i = 0; i < 5; i++) osc('sine', 120 - i * 15, 50, t + i * 0.12, 0.2, 0.3 * v, o); },
  win(t, v, o) { [523, 659, 784, 1047, 1319].forEach((f, i) => { osc('square', f, f, t + i * 0.12, 0.25, 0.12 * v, o); osc('triangle', f / 2, f / 2, t + i * 0.12, 0.3, 0.12 * v, o); }); },
  lose(t, v, o) { [440, 415, 392, 330].forEach((f, i) => osc('triangle', f, f * 0.97, t + i * 0.22, 0.4, 0.18 * v, o)); },
  wave(t, v, o) { [392, 523, 659].forEach((f, i) => osc('square', f, f, t + i * 0.1, 0.18, 0.1 * v, o)); },
};
const SFX_GAP = { hit: 0.035, swing: 0.04, shoot: 0.04, tower: 0.08, coin: 0.05, pop: 0.05, magic: 0.05, heart: 0.06 };
// x, y：世界坐标（null = 不按距离衰减）
function sfx(name, x, y, vol) {
  if (!AU.ctx || !AU.on || !SYN[name]) return;
  const now = AU.ctx.currentTime;
  if (AU.last[name] && now - AU.last[name] < (SFX_GAP[name] || 0.02)) return;
  let v = vol == null ? 1 : vol;
  if (x != null) {
    const d = Math.hypot(x - AU.camX, y - AU.camY);
    v *= clamp(1 - (d - 350) / 1000, 0, 1);
    if (v < 0.04) return;
  }
  AU.last[name] = now;
  SYN[name](now + 0.005, v, AU.sfxBus);
}
// 播报语音：一句一句来，后来的排队（最多排两句）
function sayVoice(id) {
  if (!AU.ctx || !AU.on) return;
  const b = AU.voices[id];
  if (!b) return;
  const now = AU.ctx.currentTime;
  if (AU.playing && AU.playing.end > now + 0.05) {
    if (AU.queue.length < 2) AU.queue.push(id); else AU.queue[1] = id;   // 排满了：换掉后面那句，最新的先播
    return;
  }
  const s = AU.ctx.createBufferSource();
  s.buffer = b; s.connect(AU.voiceBus); s.start(now);
  AU.playing = { end: now + b.duration };
  AU.sfxBus.gain.setTargetAtTime(0.3, now, 0.05);
  AU.sfxBus.gain.setTargetAtTime(0.55, now + b.duration, 0.15);
  s.onended = () => { AU.playing = null; const n = AU.queue.shift(); if (n) sayVoice(n); };
}

function layout() {
  const app = $('#app'), st = $('#stage');

  st.style.transform = G.rot ? `translate(${vw}px,0) rotate(90deg)` : 'none';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  resizeRender(G.cssW, G.cssH, dpr);
  // 刘海让出的地方（横屏时左右）
  const cs = getComputedStyle(document.documentElement);
  const px = v => (parseFloat(cs.getPropertyValue(v)) || 0) * dpr / R.k;
  INS.l = Math.round(px('--sal')); INS.r = Math.round(px('--sar')); INS.t = 0; INS.b = Math.round(px('--sab') * 0.5);
  if (G.rot) { INS.l = INS.r = 0; }
}
function toGame(cx, cy) {                   // 视口坐标 → 舞台里的 CSS 坐标

/* ---------- 对阵、开局 ---------- */
function rosters(hid, seed) {
  // 蓝方：我 + 另外 4 个（6 个英雄里去掉一个，优先保留打野、射手）；红方：随机去掉一个
  const others = HEROES.map(h => h.id).filter(id => id !== hid);
  let r = seed;
  const rnd2 = () => { r = (r * 16807) % 2147483647; return r / 2147483647; };
  const dropB = others[Math.floor(rnd2() * others.length)];
  const blue = [hid, ...others.filter(id => id !== dropB)];
  const all = HEROES.map(h => h.id);
  const dropR = all[Math.floor(rnd2() * all.length)];
  const red = all.filter(id => id !== dropR);
  for (let i = red.length - 1; i > 0; i--) { const j = Math.floor(rnd2() * (i + 1)); [red[i], red[j]] = [red[j], red[i]]; }
  return { blue, red };
}
function startLoading() {
  const seed = (Date.now() % 100000) + 7;
  const { blue, red } = rosters(G.hero, seed);
  const s = $('#vs');
  const row = (list, team) => list.map((hid, i) => `<div class="vsh ${team ? 'r' : 'b'} ${team === 0 && i === 0 ? 'me' : ''}"><img src="${heroImg(hid, 2)}" alt=""><span>${HERO_BY_ID[hid].name}</span><small>${team === 0 && i === 0 ? '你' : '电脑'}</small></div>`).join('');
  s.innerHTML = `<div class="vsrow">${row(blue, 0)}</div><div class="vsmid"><span class="vb">蓝方</span><b>VS</b><span class="vr">红方</span></div><div class="vsrow">${row(red, 1)}</div>
    <div class="load"><div class="bar"><i id="ldbar"></i></div><span id="ldtxt">加载中 0%</span></div>`;
  show('vs');
  let p = 0;
  const tick = () => {
    p = Math.min(100, p + 7 + Math.random() * 12);
    const bar = $('#ldbar'); if (bar) bar.style.width = p + '%';
    const tx = $('#ldtxt'); if (tx) tx.textContent = '加载中 ' + Math.floor(p) + '%';
    if (p < 100) setTimeout(tick, 90);
    else setTimeout(() => startGame(blue, red, seed), 350);
  };
  tick();
}
function startGame(blue, red, seed) {
  G.W = newWorld({ blue, red, player: 0, diff: G.diff, seed });
  G.me = G.W.units.find(u => u.isPlayer);
  G.demo = null;
  R.parts.length = 0; R.floats.length = 0; R.fxs.length = 0; HUD.ann.length = 0; HUD.feed.length = 0; HUD.tips = 12;
  R.camX = G.me.x; R.camY = G.me.y;
  G.paused = false; G.endShown = false; G.acc = 0; G.crystalWarnT = -99;
  inpReset();
  hideAll(); G.scr = 'game';
}

function openPause() {

const SPREE = { 3: ['大杀特杀', 'spree3'], 4: ['主宰比赛', 'spree4'], 5: ['杀人如麻', 'spree5'], 6: ['无人能挡', 'spree6'], 7: ['横扫千军', 'spree7'] };

/* ---------- 主循环 ---------- */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - G.last) / 1000));
  G.last = now;
  if (G.scr === 'boot') return;
  const W = G.W;
  if (W && (G.scr === 'game' || G.scr === 'shop' || G.scr === 'pause' || G.scr === 'result')) {
    if (!G.paused && G.scr !== 'result') {
      playerCmd(W, G.me);
      G.acc += dt;
      let n = 0;
      while (G.acc >= STEP && n < 4) { step(W, STEP); G.acc -= STEP; n++; }
      if (n === 4) G.acc = 0;
      handleEvents(W, G.me, false);
    }
    if (W.winner >= 0 && !G.endShown) {
      G.endShown = true;
      const cr = W.units.find(u => u.kind === 'crystal' && u.team !== W.winner);
      R.peek = cr ? [cr.x, cr.y] : null;
      setTimeout(() => {
        announce(W.winner === 0 ? '胜利' : '失败', W.winner === 0 ? C.gold : C.red, { voice: W.winner === 0 ? 'win' : 'lose', dur: 3, urgent: true });
        sfx(W.winner === 0 ? 'win' : 'lose');
      }, 900);
      setTimeout(() => { R.peek = null; showResult(); }, 3600);
    }
    AU.camX = R.camX; AU.camY = R.camY;
    if (!G.paused) ambientTick(dt);
    renderWorld(W, G.me, G.paused ? 0 : dt);
    if (G.scr !== 'result') drawHUD(W, G.me, dt);
  } else if (G.demo) {
    const D = G.demo;
    G.acc += dt;
    let n = 0;
    while (!G.freeze && G.acc >= 1 / 30 && n < 3) { step(D, 1 / 30); G.acc -= 1 / 30; n++; }
    if (n === 3) G.acc = 0;
    handleEvents(D, null, true);
    HUD.feed.length = 0;
    G.demoT += dt;
    if (!G.freeze && (G.demoT > 9 || G.demoCam.dead)) {        // 换一个英雄跟拍，挑离敌人最近的（有架打）
      G.demoT = 0;
      let best = null, bd = 1e9;
      for (const h of D._heroes) { if (h.dead) continue; for (const e of D._heroes) if (e.team !== h.team && !e.dead) { const d = dist(h, e); if (d < bd) { bd = d; best = h; } } }
      G.demoCam = best || D._heroes[0];
    }
    if (D.winner >= 0) startDemo();
    renderWorld(D, G.demoCam, G.freeze ? 0 : dt);
  }
  // 放大到屏幕
  const ctx = R.ctx;
  ctx.fillStyle = '#0E0B16'; ctx.fillRect(0, 0, R.cv.width, R.cv.height);
  ctx.drawImage(R.buf, 0, 0, R.bw, R.bh, R.ox, R.oy, R.bw * R.k, R.bh * R.k);
}

/* ---------- 启动 ---------- */
function bindInput() {
  const cv = R.cv;
  const pos = ev => { const [x, y] = toGame(ev.clientX, ev.clientY); return cssToBuf(x, y); };
  cv.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* 有的浏览器不支持 */ }
    if (G.scr !== 'game' || G.paused) return;
    audioInit();
    const [x, y] = pos(ev);
    onPointerDown(G.W, G.me, ev.pointerId, x, y);
  });
  cv.addEventListener('pointermove', ev => {
    const [x, y] = pos(ev);
    if (ev.pointerType === 'mouse') { INP.mouse = [x, y]; INP.mouseT = R.t; }
    if (G.scr !== 'game') return;
    onPointerMove(G.W, G.me, ev.pointerId, x, y);
  });
  const up = ev => { if (G.scr !== 'game' && G.scr !== 'shop' && G.scr !== 'pause') return; const [x, y] = pos(ev); onPointerUp(G.W, G.me, ev.pointerId, x, y); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', ev => ev.preventDefault());
  window.addEventListener('keydown', ev => {
    if (G.scr === 'game' && !G.paused) {
      if (ev.code === 'KeyP' || ev.code === 'Escape') { openPause(); return; }
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(ev.code)) ev.preventDefault();
      if (!ev.repeat) onKey(G.W, G.me, ev.code, true);
      else INP.keys[ev.code] = true;
    } else if (G.scr === 'pause' && (ev.code === 'KeyP' || ev.code === 'Escape')) closePause();
  });
  window.addEventListener('keyup', ev => { onKey(G.W, G.me, ev.code, false); });
  window.addEventListener('blur', () => { INP.keys = {}; INP.keyAtk = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.scr === 'game' && G.W && G.W.winner < 0) openPause(); });
  INP.onPause = openPause;
  INP.onShop = openShop;
  INP.onAuto = () => { G.W.auto = !G.W.auto; toast(G.W.auto ? '托管：电脑替你打' : '取消托管', '#9CF09C'); if (!G.W.auto) G.me.cmd = {}; };
}
// 页面更新（重新发布）时保住正在打的这一局：对局数据是纯 JSON（下划线开头的是缓存，不存）
function snapshotState() {
  const base = { hero: G.hero, diff: G.diff };
  if (!G.W || !G.me || G.W.winner >= 0 || !['game', 'pause', 'shop'].includes(G.scr)) return base;
  try { base.save = JSON.stringify(G.W, (k, v) => (k[0] === '_' ? undefined : v)); base.camX = R.camX; base.camY = R.camY; } catch (e) { /* 存不了就不存 */ }
  return base;
}
function restoreGame(data) {
  try {
    const W = JSON.parse(data.save);
    relink(W);
    const me = W.units.find(u => u.isPlayer);
    if (!me) return false;
    G.W = W; G.me = me; G.demo = null;
    R.camX = data.camX || me.x; R.camY = data.camY || me.y;
    G.endShown = false; G.acc = 0; G.crystalWarnT = -99;
    inpReset(); hideAll(); G.scr = 'game';
    openPause();
    return true;
  } catch (e) { return false; }
}
function boot(data) {
  data = data || {};
  loadPrefs();
  if (data.hero && HERO_BY_ID[data.hero]) G.hero = data.hero;
  if (data.diff != null) G.diff = data.diff;
  HUD.keyboard = !(('ontouchstart' in window) || navigator.maxTouchPoints > 0);
  R.cv = $('#cv'); R.buf = document.createElement('canvas');
  layout();
  window.addEventListener('resize', () => setTimeout(layout, 50));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(layout, 50));
  bindInput();
  const bootTxt = $('#bootTxt');
  const go = () => {
    initGrid();
    R.mapTex = buildMapTex();
    R.mini = buildMinimap(R.mapTex, 64);
    buildTitle();
    if (!(data.save && restoreGame(data))) { startDemo(); show('title'); }
    G.last = performance.now();
  };
  // 先让“加载中”画出来，再算地图（要几百毫秒）
  const fontReady = document.fonts && document.fonts.load ? document.fonts.load('12px XGPixel', '小怪峡谷') : Promise.resolve();
  fontReady.catch(() => {}).then(() => setTimeout(() => { try { go(); } catch (e) { if (bootTxt) bootTxt.textContent = '出错了：' + e.message; throw e; } }, 30));
  requestAnimationFrame(frame);
}
function start(data) {
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', () => boot(data));
  else boot(data);
}
const HOT = window.claude && window.claude.hot;
if (HOT && HOT.snapshot) HOT.snapshot(snapshotState);
if (HOT && HOT.ready) HOT.ready(start); else start((HOT && HOT.data) || {});

</script>
