<title>峡谷争锋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="王者荣耀式的 5V5 三路对战：3D 斜视角，六个原创英雄，推塔、打野、大龙小龙；手机横屏触屏操作，电脑键盘操作。">
<style>
/* 布局：一块三维画布铺满，上面一层 HUD 画布，菜单是再上面的 DOM。手机竖着拿时盖一层“请横屏”。只有深色一种外观（游戏画面）。 */
:root {
  color-scheme: dark;
  --navy: #0A1230; --navy2: #14224A; --navy3: #1E3266; --gold: #E9C46A; --gold2: #FBE6A6; --gold3: #B8862E; --white: #F3F0E6; --dim: #A9B0C8;
  --blue: #4AA8FF; --red: #FF5A4E; --green: #6CF06C; --panel: rgba(8,14,38,0.9);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif;
}
html, body { height: 100%; margin: 0; background: var(--navy); color: var(--white); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; overflow: hidden; background: #0A1230; touch-action: none; font-family: var(--font); }
#gl, #hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.scr { position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: 12px max(16px, var(--sar)) max(12px, var(--sab)) max(16px, var(--sal)); font-size: 14px; line-height: 1.55; color: var(--white); overflow-y: auto; touch-action: pan-y; }
.scr[hidden] { display: none !important; }
b { color: var(--gold2); } b.b { color: var(--blue); } b.r { color: var(--red); }
.btn { font: inherit; font-weight: 800; font-size: 16px; line-height: 1; padding: 11px 26px; color: #3A2208; border: 1px solid #FFF1C2; border-radius: 6px; cursor: pointer;
  background: linear-gradient(#FCE7A8, #E6B856 55%, #C99236); box-shadow: 0 0 0 1px #6A4410, 0 4px 14px rgba(233,196,106,0.35), inset 0 1px 0 rgba(255,255,255,0.7); touch-action: manipulation; letter-spacing: 2px; }
.btn:active { transform: translateY(1px); filter: brightness(0.95); }
.btn:focus-visible, .card:focus-visible, .it:focus-visible, .seg button:focus-visible, .x:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }
.btn.big { font-size: 20px; padding: 14px 44px; }
.btn.sm { font-size: 13px; padding: 9px 16px; color: var(--gold2); background: linear-gradient(rgba(30,50,102,0.95), rgba(14,24,56,0.95)); border-color: rgba(233,196,106,0.55); box-shadow: 0 0 0 1px rgba(0,0,0,0.5); letter-spacing: 1px; }
.btn.red { color: #FFE0DC; background: linear-gradient(#B8413A, #7A1E1A); border-color: #FF9A90; box-shadow: 0 0 0 1px #3A0A08; }
.btn:disabled { filter: grayscale(1) brightness(0.7); cursor: default; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.hd { font-size: 22px; font-weight: 800; color: var(--gold2); letter-spacing: 3px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: center; text-shadow: 0 2px 10px rgba(233,196,106,0.35); }
.hd small { font-size: 13px; color: var(--dim); letter-spacing: 0; font-weight: 500; text-shadow: none; }
.box { background: var(--panel); border: 1px solid rgba(233,196,106,0.45); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 40px rgba(60,100,200,0.12);
  padding: 16px 20px; max-width: 680px; display: flex; flex-direction: column; gap: 10px; align-items: center; box-sizing: border-box; }
.box.wide { max-width: 900px; width: 100%; }
.box p { margin: 0; max-width: 62ch; }
/* 开头 */
#boot { background: radial-gradient(ellipse at 50% 40%, #1E3266, #0A1230 70%); }
#boot .hd { font-size: 40px; letter-spacing: 10px; }
#title { background: linear-gradient(90deg, rgba(6,10,30,0.82), rgba(6,10,30,0.25) 45%, rgba(6,10,30,0) 70%), linear-gradient(0deg, rgba(6,10,30,0.7), rgba(6,10,30,0) 40%);
  align-items: flex-start; justify-content: center; padding-left: max(5vw, var(--sal)); }
.logo .l1 { font-size: 64px; font-weight: 900; line-height: 1.05; letter-spacing: 10px; background: linear-gradient(#FFF6D2, #F4CF73 45%, #C98A2C 60%, #F9DE8E); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #4A2A08) drop-shadow(0 8px 18px rgba(0,0,0,0.6)); }
.logo .l2 { font-size: 15px; color: var(--white); margin-top: 6px; letter-spacing: 4px; text-shadow: 0 2px 6px #000; }
.menu { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; margin-top: 10px; }
.seg { display: flex; border: 1px solid rgba(233,196,106,0.6); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 18px; border: 0; background: rgba(14,24,56,0.85); color: var(--dim); cursor: pointer; }
.seg button.on { background: linear-gradient(#FCE7A8, #D9A440); color: #3A2208; }
.rec { color: var(--gold2); min-height: 20px; text-shadow: 0 2px 6px #000; }
/* 选英雄：左边英雄格子，中间是三维模型（画在后面的画布上），右边技能 */
#select { background: linear-gradient(90deg, rgba(6,10,30,0.92) 0%, rgba(6,10,30,0.55) 30%, rgba(6,10,30,0) 40%, rgba(6,10,30,0) 58%, rgba(6,10,30,0.7) 66%, rgba(6,10,30,0.92) 100%);
  flex-direction: row; align-items: stretch; justify-content: space-between; gap: 12px; }
.selL { display: flex; flex-direction: column; gap: 10px; width: min(30vw, 300px); justify-content: center; }
.selR { display: flex; flex-direction: column; gap: 8px; width: min(36vw, 380px); justify-content: center; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { font: inherit; color: var(--white); background: linear-gradient(rgba(30,50,102,0.9), rgba(10,18,44,0.95)); border: 1px solid rgba(233,196,106,0.35); border-radius: 8px; padding: 4px 2px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 0; }
.card img { width: 100%; max-width: 76px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(#4A5A8A, #141E40); }
.card .nm { font-size: 14px; font-weight: 800; } .card .rl { font-size: 12px; color: var(--dim); }
.card.on { border-color: var(--gold2); box-shadow: 0 0 0 1px var(--gold2), 0 0 16px rgba(251,230,166,0.45); background: linear-gradient(rgba(90,70,30,0.9), rgba(30,22,10,0.95)); }
.dn { font-size: 30px; font-weight: 900; color: var(--gold2); line-height: 1.1; letter-spacing: 4px; } .dn span { font-size: 14px; color: var(--dim); letter-spacing: 1px; font-weight: 600; }
.pas { color: var(--white); font-size: 13px; }
.sk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; background: rgba(10,18,44,0.7); border-radius: 8px; padding: 6px 8px; }
.sk img { width: 40px; height: 40px; flex: none; border-radius: 50%; box-shadow: 0 0 0 1px var(--gold3); }
.selBtns { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
/* 对阵 */
#vs { background: radial-gradient(ellipse at 50% 50%, rgba(30,50,102,0.96), rgba(6,10,30,0.99)); gap: 8px; }
.vsrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vsh { display: flex; flex-direction: column; align-items: center; width: 88px; padding: 6px 0 6px; border-radius: 8px; background: linear-gradient(rgba(20,40,90,0.9), rgba(8,14,38,0.9)); border: 1px solid #2E6FD0; }
.vsh.r { background: linear-gradient(rgba(90,24,24,0.9), rgba(38,8,8,0.9)); border-color: #C83A3A; }
.vsh.me { border-color: var(--green); box-shadow: 0 0 12px rgba(108,240,108,0.4); }
.vsh img { width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(#4A5A8A, #141E40); }
.vsh span { font-weight: 800; } .vsh small { color: var(--dim); font-size: 12px; }
.vsmid { display: flex; gap: 28px; align-items: center; font-size: 18px; font-weight: 800; }
.vsmid b { font-size: 52px; font-style: italic; color: var(--gold2); text-shadow: 0 0 20px rgba(233,196,106,0.6); }
.vb { color: var(--blue); } .vr { color: var(--red); }
.load { display: flex; gap: 12px; align-items: center; color: var(--dim); }
.bar { width: 240px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #C99236, #FBE6A6); }
/* 暂停、结算的战绩表 */
#pause, #result, #shop, #help { background: rgba(4,8,24,0.7); justify-content: flex-start; }
#pause > .box, #result > .box, #shop > .box, #help > .box { margin: auto 0; }
.board { border-collapse: collapse; width: 100%; font-size: 13px; }
.board th { color: var(--dim); font-weight: 600; text-align: left; padding: 0 6px 4px; }
.board td { padding: 1px 6px; white-space: nowrap; line-height: 24px; }
.board tr.b td:nth-child(2) { color: #8CC8FF; } .board tr.r td:nth-child(2) { color: #FF9A90; }
.board tr.me td { background: rgba(108,240,108,0.12); }
.board tr.gap td { height: 6px; padding: 0; }
.board td img { width: 24px; height: 24px; border-radius: 50%; vertical-align: middle; background: #1E3266; }
.board td.its img { width: 20px; height: 20px; border-radius: 4px; margin-right: 2px; }
.res { font-size: 60px; font-weight: 900; line-height: 1.1; letter-spacing: 16px; }
.res.win { background: linear-gradient(#FFF6D2, #F4CF73 50%, #C98A2C); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #4A2A08); }
.res.lose { color: #B8C0D8; text-shadow: 0 3px 0 #1A2040; }
.sub { color: var(--white); text-align: center; }
/* 商店 */
.shopbox { max-width: 900px; }
.x { font: inherit; font-size: 13px; font-weight: 700; color: var(--gold2); background: rgba(14,24,56,0.9); border: 1px solid rgba(233,196,106,0.55); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.shopwrap { display: flex; gap: 14px; width: 100%; align-items: flex-start; flex-wrap: wrap; }
.shoplist { flex: 2 1 330px; min-width: 0; max-height: 54vh; overflow-y: auto; }
.cat { color: var(--dim); margin: 6px 0 4px; font-weight: 700; }
.its { display: flex; flex-wrap: wrap; gap: 6px; }
.it { font: inherit; font-size: 12px; color: var(--white); background: rgba(20,34,74,0.9); border: 1px solid rgba(233,196,106,0.2); border-radius: 6px; padding: 3px 8px 3px 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.it img { width: 34px; height: 34px; }
.it small { color: var(--gold); font-size: 12px; }
.it.on { border-color: var(--gold2); background: rgba(90,70,30,0.9); } .it.own { opacity: 0.6; }
.shopd { flex: 1 1 210px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.shopd > img { width: 56px; height: 56px; }
.from { color: var(--dim); } .inv img { width: 22px; height: 22px; margin-right: 3px; vertical-align: middle; }
/* 竖屏：请横过来 */
#rotate { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 40%, #1E3266, #0A1230 70%); z-index: 10; text-align: center; padding: 24px; }
#rotate.on { display: flex; }
#rotate .ph { width: 54px; height: 92px; border: 4px solid var(--gold2); border-radius: 10px; animation: turn 2.2s ease-in-out infinite; }
#rotate .t1 { font-size: 20px; font-weight: 800; color: var(--gold2); letter-spacing: 2px; } #rotate .t2 { color: var(--dim); font-size: 14px; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
@media (max-height: 430px) {
  .logo .l1 { font-size: 46px; } .scr { gap: 8px; } .btn.big { padding: 11px 34px; font-size: 18px; }
  .dn { font-size: 24px; } .sk { padding: 4px 6px; font-size: 12px; } .sk img { width: 34px; height: 34px; }
  .card img { max-width: 58px; } .card .nm { font-size: 13px; }
  .vsh { width: 76px; } .vsh img { width: 52px; height: 52px; } .vsmid b { font-size: 38px; }
  .res { font-size: 42px; } .box { padding: 10px 14px; gap: 8px; } .board td { line-height: 20px; }
  .board td img { width: 20px; height: 20px; } .board td.its img { width: 17px; height: 17px; }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } #rotate .ph { animation: none; transform: rotate(-90deg); } }
</style>

  <div class="scr" id="select" hidden></div>
  <div class="scr" id="vs" hidden></div>
