<title>峡谷争锋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="王者荣耀式的 5V5 三路对战：3D 斜视角，六个原创英雄，推塔、打野、大龙小龙；手机横屏触屏操作，电脑键盘操作。">
<style>
/* 布局：一块三维画布铺满，上面一层 HUD 画布，菜单是再上面的 DOM。手机竖着拿时盖一层“请横屏”。只有深色一种外观（游戏画面）。 */
:root {
  color-scheme: dark;
  --navy: #0A1230; --navy2: #14224A; --navy3: #1E3266; --gold: #E9C46A; --gold2: #FBE6A6; --gold3: #B8862E; --white: #F3F0E6; --dim: #A9B0C8;
  --blue: #4AA8FF; --red: #FF5A4E; --green: #6CF06C; --panel: rgba(8,14,38,0.9);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif;
}
html, body { height: 100%; margin: 0; background: var(--navy); color: var(--white); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; overflow: hidden; background: #0A1230; touch-action: none; font-family: var(--font); }
#gl, #hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.scr { position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: 12px max(16px, var(--sar)) max(12px, var(--sab)) max(16px, var(--sal)); font-size: 14px; line-height: 1.55; color: var(--white); overflow-y: auto; touch-action: pan-y; }
.scr[hidden] { display: none !important; }
b { color: var(--gold2); } b.b { color: var(--blue); } b.r { color: var(--red); }
.btn { font: inherit; font-weight: 800; font-size: 16px; line-height: 1; padding: 11px 26px; color: #3A2208; border: 1px solid #FFF1C2; border-radius: 6px; cursor: pointer;
  background: linear-gradient(#FCE7A8, #E6B856 55%, #C99236); box-shadow: 0 0 0 1px #6A4410, 0 4px 14px rgba(233,196,106,0.35), inset 0 1px 0 rgba(255,255,255,0.7); touch-action: manipulation; letter-spacing: 2px; }
.btn:active { transform: translateY(1px); filter: brightness(0.95); }
.btn:focus-visible, .card:focus-visible, .it:focus-visible, .seg button:focus-visible, .x:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }
.btn.big { font-size: 20px; padding: 14px 44px; }
.btn.sm { font-size: 13px; padding: 9px 16px; color: var(--gold2); background: linear-gradient(rgba(30,50,102,0.95), rgba(14,24,56,0.95)); border-color: rgba(233,196,106,0.55); box-shadow: 0 0 0 1px rgba(0,0,0,0.5); letter-spacing: 1px; }
.btn.red { color: #FFE0DC; background: linear-gradient(#B8413A, #7A1E1A); border-color: #FF9A90; box-shadow: 0 0 0 1px #3A0A08; }
.btn:disabled { filter: grayscale(1) brightness(0.7); cursor: default; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.hd { font-size: 22px; font-weight: 800; color: var(--gold2); letter-spacing: 3px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: center; text-shadow: 0 2px 10px rgba(233,196,106,0.35); }
.hd small { font-size: 13px; color: var(--dim); letter-spacing: 0; font-weight: 500; text-shadow: none; }
.box { background: var(--panel); border: 1px solid rgba(233,196,106,0.45); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 40px rgba(60,100,200,0.12);
  padding: 16px 20px; max-width: 680px; display: flex; flex-direction: column; gap: 10px; align-items: center; box-sizing: border-box; }
.box.wide { max-width: 900px; width: 100%; }
.box p { margin: 0; max-width: 62ch; }
/* 开头 */
#boot { background: radial-gradient(ellipse at 50% 40%, #1E3266, #0A1230 70%); }
#boot .hd { font-size: 40px; letter-spacing: 10px; }
#title { background: linear-gradient(90deg, rgba(6,10,30,0.82), rgba(6,10,30,0.25) 45%, rgba(6,10,30,0) 70%), linear-gradient(0deg, rgba(6,10,30,0.7), rgba(6,10,30,0) 40%);
  align-items: flex-start; justify-content: center; padding-left: max(5vw, var(--sal)); }
.logo .l1 { font-size: 64px; font-weight: 900; line-height: 1.05; letter-spacing: 10px; background: linear-gradient(#FFF6D2, #F4CF73 45%, #C98A2C 60%, #F9DE8E); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #4A2A08) drop-shadow(0 8px 18px rgba(0,0,0,0.6)); }
.logo .l2 { font-size: 15px; color: var(--white); margin-top: 6px; letter-spacing: 4px; text-shadow: 0 2px 6px #000; }
.menu { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; margin-top: 10px; }
.seg { display: flex; border: 1px solid rgba(233,196,106,0.6); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 18px; border: 0; background: rgba(14,24,56,0.85); color: var(--dim); cursor: pointer; }
.seg button.on { background: linear-gradient(#FCE7A8, #D9A440); color: #3A2208; }
.rec { color: var(--gold2); min-height: 20px; text-shadow: 0 2px 6px #000; }
/* 选英雄：左边英雄格子，中间是三维模型（画在后面的画布上），右边技能 */
#select { background: linear-gradient(90deg, rgba(6,10,30,0.92) 0%, rgba(6,10,30,0.55) 30%, rgba(6,10,30,0) 40%, rgba(6,10,30,0) 58%, rgba(6,10,30,0.7) 66%, rgba(6,10,30,0.92) 100%);
  flex-direction: row; align-items: stretch; justify-content: space-between; gap: 12px; }
.selL { display: flex; flex-direction: column; gap: 10px; width: min(30vw, 300px); justify-content: center; }
.selR { display: flex; flex-direction: column; gap: 8px; width: min(36vw, 380px); justify-content: center; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { font: inherit; color: var(--white); background: linear-gradient(rgba(30,50,102,0.9), rgba(10,18,44,0.95)); border: 1px solid rgba(233,196,106,0.35); border-radius: 8px; padding: 4px 2px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 0; }
.card img { width: 100%; max-width: 76px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(#4A5A8A, #141E40); }
.card .nm { font-size: 14px; font-weight: 800; } .card .rl { font-size: 12px; color: var(--dim); }
.card.on { border-color: var(--gold2); box-shadow: 0 0 0 1px var(--gold2), 0 0 16px rgba(251,230,166,0.45); background: linear-gradient(rgba(90,70,30,0.9), rgba(30,22,10,0.95)); }
.dn { font-size: 30px; font-weight: 900; color: var(--gold2); line-height: 1.1; letter-spacing: 4px; } .dn span { font-size: 14px; color: var(--dim); letter-spacing: 1px; font-weight: 600; }
.pas { color: var(--white); font-size: 13px; }
.sk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; background: rgba(10,18,44,0.7); border-radius: 8px; padding: 6px 8px; }
.sk img { width: 40px; height: 40px; flex: none; border-radius: 50%; box-shadow: 0 0 0 1px var(--gold3); }
.selBtns { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
/* 对阵 */
#vs { background: radial-gradient(ellipse at 50% 50%, rgba(30,50,102,0.96), rgba(6,10,30,0.99)); gap: 8px; }
.vsrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vsh { display: flex; flex-direction: column; align-items: center; width: 88px; padding: 6px 0 6px; border-radius: 8px; background: linear-gradient(rgba(20,40,90,0.9), rgba(8,14,38,0.9)); border: 1px solid #2E6FD0; }
.vsh.r { background: linear-gradient(rgba(90,24,24,0.9), rgba(38,8,8,0.9)); border-color: #C83A3A; }
.vsh.me { border-color: var(--green); box-shadow: 0 0 12px rgba(108,240,108,0.4); }
.vsh img { width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(#4A5A8A, #141E40); }
.vsh span { font-weight: 800; } .vsh small { color: var(--dim); font-size: 12px; }
.vsmid { display: flex; gap: 28px; align-items: center; font-size: 18px; font-weight: 800; }
.vsmid b { font-size: 52px; font-style: italic; color: var(--gold2); text-shadow: 0 0 20px rgba(233,196,106,0.6); }
.vb { color: var(--blue); } .vr { color: var(--red); }
.load { display: flex; gap: 12px; align-items: center; color: var(--dim); }
.bar { width: 240px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #C99236, #FBE6A6); }
/* 暂停、结算的战绩表 */
#pause, #result, #shop, #help { background: rgba(4,8,24,0.7); justify-content: flex-start; }
#pause > .box, #result > .box, #shop > .box, #help > .box { margin: auto 0; }
.board { border-collapse: collapse; width: 100%; font-size: 13px; }
.board th { color: var(--dim); font-weight: 600; text-align: left; padding: 0 6px 4px; }
.board td { padding: 1px 6px; white-space: nowrap; line-height: 24px; }
.board tr.b td:nth-child(2) { color: #8CC8FF; } .board tr.r td:nth-child(2) { color: #FF9A90; }
.board tr.me td { background: rgba(108,240,108,0.12); }
.board tr.gap td { height: 6px; padding: 0; }
.board td img { width: 24px; height: 24px; border-radius: 50%; vertical-align: middle; background: #1E3266; }
.board td.its img { width: 20px; height: 20px; border-radius: 4px; margin-right: 2px; }
.res { font-size: 60px; font-weight: 900; line-height: 1.1; letter-spacing: 16px; }
.res.win { background: linear-gradient(#FFF6D2, #F4CF73 50%, #C98A2C); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #4A2A08); }
.res.lose { color: #B8C0D8; text-shadow: 0 3px 0 #1A2040; }
.sub { color: var(--white); text-align: center; }
/* 商店 */
.shopbox { max-width: 900px; }
.x { font: inherit; font-size: 13px; font-weight: 700; color: var(--gold2); background: rgba(14,24,56,0.9); border: 1px solid rgba(233,196,106,0.55); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.shopwrap { display: flex; gap: 14px; width: 100%; align-items: flex-start; flex-wrap: wrap; }
.shoplist { flex: 2 1 330px; min-width: 0; max-height: 54vh; overflow-y: auto; }
.cat { color: var(--dim); margin: 6px 0 4px; font-weight: 700; }
.its { display: flex; flex-wrap: wrap; gap: 6px; }
.it { font: inherit; font-size: 12px; color: var(--white); background: rgba(20,34,74,0.9); border: 1px solid rgba(233,196,106,0.2); border-radius: 6px; padding: 3px 8px 3px 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.it img { width: 34px; height: 34px; }
.it small { color: var(--gold); font-size: 12px; }
.it.on { border-color: var(--gold2); background: rgba(90,70,30,0.9); } .it.own { opacity: 0.6; }
.shopd { flex: 1 1 210px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.shopd > img { width: 56px; height: 56px; }
.from { color: var(--dim); } .inv img { width: 22px; height: 22px; margin-right: 3px; vertical-align: middle; }
/* 竖屏：请横过来 */
#rotate { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 40%, #1E3266, #0A1230 70%); z-index: 10; text-align: center; padding: 24px; }
#rotate.on { display: flex; }
#rotate .ph { width: 54px; height: 92px; border: 4px solid var(--gold2); border-radius: 10px; animation: turn 2.2s ease-in-out infinite; }
#rotate .t1 { font-size: 20px; font-weight: 800; color: var(--gold2); letter-spacing: 2px; } #rotate .t2 { color: var(--dim); font-size: 14px; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
@media (max-height: 430px) {
  .logo .l1 { font-size: 46px; } .scr { gap: 8px; } .btn.big { padding: 11px 34px; font-size: 18px; }
  .dn { font-size: 24px; } .sk { padding: 4px 6px; font-size: 12px; } .sk img { width: 34px; height: 34px; }
  .card img { max-width: 58px; } .card .nm { font-size: 13px; }
  .vsh { width: 76px; } .vsh img { width: 52px; height: 52px; } .vsmid b { font-size: 38px; }
  .res { font-size: 42px; } .box { padding: 10px 14px; gap: 8px; } .board td { line-height: 20px; }
  .board td img { width: 20px; height: 20px; } .board td.its img { width: 17px; height: 17px; }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } #rotate .ph { animation: none; transform: rotate(-90deg); } }

'use strict';
/* data.js：地图、英雄、技能、装备和各种数值。纯数据和几何函数，浏览器和 node 测试共用。
   坐标：x 向右，y 向下，地图 5000×5000。蓝方基地在左下角，红方在右上角。
   对称：mir() 沿河道（y = x）翻过去，蓝方的东西变成红方的；swapLane() 沿中路对角线翻，上路变下路。 */

const L = 5000;              // 地图边长
const PXU = 2.5;             // 画面上一个像素 = 2.5 单位
const CELL = 25;             // 碰撞格边长
const GN = L / CELL;         // 每边 200 格
const INFL = 20;             // 墙往外扩多少（单位的半径），格子中心在扩过的墙里就不能走

const mir = p => [p[1], p[0]];
const swapLane = p => [L - p[1], L - p[0]];

/* ---------- 兵线 ---------- */
const LANE_TOP = [[430, 4120], [350, 3700], [350, 820], [480, 480], [820, 350], [3700, 350], [4120, 430]];
const LANE_MID = [[860, 4140], [4140, 860]];
const LANE_BOT = LANE_TOP.map(swapLane);
const LANES = [LANE_TOP, LANE_MID, LANE_BOT];         // 0 对抗路（上） 1 中路 2 发育路（下）
const LANE_NAME = ['对抗路', '中路', '发育路'];

// TOWERS[lane][tier]：tier 0 一塔（外塔）、1 二塔、2 高地塔。塔立在兵线旁边（不挡路）：边路的塔靠地图边，中路的塔偏左上

/* ---------- 地形：墙和草丛（蓝方上半区写一份，其他三块翻出来） ---------- */
// c：圆 [x, y, r]；k：胶囊（粗线段）[x1, y1, x2, y2, r]
const Q_WALLS = [
  // 上路边的墙（中间留出进野区的口子）
  { k: [640, 1260, 640, 1850, 85] },

const Q_BUSH = [
  { k: [430, 1420, 430, 1700, 70] },        // 上路草丛
  { k: [1640, 2930, 1790, 2780, 65] },      // 中路进野区的口子
  { c: [1300, 2300, 80] },                  // 蓝区旁边

  { c: [780, 2950, 70] },                   // 狼窝旁
];
const BASE_WALLS = [
  { k: [600, 3480, 1060, 3560, 95] },       // 基地上边那道墙（对抗路出口和中路出口之间）
];
function mapShapes(list) {
  const out = [];
  const add = (s, f) => {
    if (s.c) { const p = f([s.c[0], s.c[1]]); out.push({ c: [p[0], p[1], s.c[2]] }); }
    else { const a = f([s.k[0], s.k[1]]), b = f([s.k[2], s.k[3]]); out.push({ k: [a[0], a[1], b[0], b[1], s.k[4]] }); }
  };
  for (const s of list) {
    add(s, p => p); add(s, swapLane); add(s, mir); add(s, p => mir(swapLane(p)));
  }
  return out;
}
const WALLS = (() => {
  const w = mapShapes(Q_WALLS);
  for (const s of BASE_WALLS) {               // 基地墙：蓝方上下两道 + 红方两道
    const k = s.k;
    for (const f of [p => p, swapLane, mir, p => mir(swapLane(p))]) {
      const a = f([k[0], k[1]]), b = f([k[2], k[3]]);
      w.push({ k: [a[0], a[1], b[0], b[1], k[4]] });
    }
  }
  return w;
})();
const BUSHES = mapShapes(Q_BUSH);
const BORDER = 150;                            // 地图四周一圈是墙

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + t * dx - px, qy = ay + t * dy - py;
  return Math.sqrt(qx * qx + qy * qy);
}
function shapeDist(s, x, y) {               // 到形状边缘的距离（里面是负数）
  if (s.c) return Math.hypot(x - s.c[0], y - s.c[1]) - s.c[2];
  return segDist(x, y, s.k[0], s.k[1], s.k[2], s.k[3]) - s.k[4];
}
function wallDist(x, y) {
  let d = Math.min(x - BORDER, y - BORDER, L - BORDER - x, L - BORDER - y);
  for (const s of WALLS) { const v = shapeDist(s, x, y); if (v < d) d = v; }
  return d;
}
function bushAt(x, y) {                       // 在第几个草丛里（从 1 起），不在就是 0
  for (let i = 0; i < BUSHES.length; i++) if (shapeDist(BUSHES[i], x, y) < 0) return i + 1;
  return 0;
}

/* ===== sim.js ===== */
'use strict';
/* sim.js：对局逻辑（不碰 DOM），浏览器和 node 测试共用。
   W（world）里只放能 JSON 化的数据：单位之间用 id 互相引用；下划线开头的字段是缓存（relink() 重建）。
   一帧：step(W, dt) —— 刷兵、野怪、建筑、小兵、英雄（玩家的指令 / 电脑的指令都在 h.cmd 里）、弹道、地面效果。
   给画面和声音的消息放在 W.ev 里，由外面取走清空。 */

/* ---------- 随机数（种子存在 W.seed 里，存档后接着算） ---------- */
function rnd(W) {
  let a = (W.seed = (W.seed + 0x6D2B79F5) | 0);
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const edge = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) - a.r - b.r;   // 两个单位边缘之间的距离

/* ---------- 碰撞格 ---------- */
const GRID = { blocked: null, wall: null, bush: null };
function shapeCells(s, pad, fn) {           // 形状（外扩 pad）盖住的格子
  const bb = s.c ? [s.c[0] - s.c[2], s.c[1] - s.c[2], s.c[0] + s.c[2], s.c[1] + s.c[2]]
    : [Math.min(s.k[0], s.k[2]) - s.k[4], Math.min(s.k[1], s.k[3]) - s.k[4], Math.max(s.k[0], s.k[2]) + s.k[4], Math.max(s.k[1], s.k[3]) + s.k[4]];
  const i0 = clamp(Math.floor((bb[0] - pad) / CELL), 0, GN - 1), i1 = clamp(Math.floor((bb[2] + pad) / CELL), 0, GN - 1);
  const j0 = clamp(Math.floor((bb[1] - pad) / CELL), 0, GN - 1), j1 = clamp(Math.floor((bb[3] + pad) / CELL), 0, GN - 1);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const d = shapeDist(s, (i + 0.5) * CELL, (j + 0.5) * CELL);
    if (d < pad) fn(j * GN + i, d);
  }
}
function initGrid() {
  if (GRID.wall) return;
  const b = new Uint8Array(GN * GN), bu = new Uint8Array(GN * GN);
  const lim = BORDER + INFL;
  for (let j = 0; j < GN; j++) for (let i = 0; i < GN; i++) {
    const x = (i + 0.5) * CELL, y = (j + 0.5) * CELL;
    if (x < lim || y < lim || x > L - lim || y > L - lim) b[j * GN + i] = 1;
  }
  for (const s of WALLS) shapeCells(s, INFL, k => { b[k] = 1; });
  BUSHES.forEach((s, n) => shapeCells(s, 0, k => { if (!bu[k]) bu[k] = n + 1; }));
  for (let k = 0; k < GN * GN; k++) if (b[k]) bu[k] = 0;
  GRID.wall = b; GRID.blocked = b.slice(); GRID.bush = bu;
}
function markStructs(W) {                   // 活着的塔、水晶占住格子
  GRID.blocked.set(GRID.wall);
  for (const u of W.units) if ((u.kind === 'tower' || u.kind === 'crystal') && !u.dead) blockStruct(u, true);

/* ---------- 兵 ---------- */
function laneOf(team, ln) { return team ? LANES[ln].map(mir) : LANES[ln]; }

    ad: D.ad * (1 + (sc - 1) * 0.7), arm: D.arm, mr: D.mr, range: D.range, asBase: D.as, ms: D.ms, proj: D.proj, vsTower: D.vsTower || 0,
    tgt: 0, think: 0 });
}

  for (const team of [0, 1]) for (let ln = 0; ln < 3; ln++) {

    const list = sup ? ['super', 'super', 'melee', 'ranged', 'ranged'] : ['melee', 'melee', 'melee', 'ranged', 'ranged'];
    if (siege) list.push('siege');

/* ---------- 弹道和地面效果 ---------- */
function spawnProj(W, o) {

}

/* ---------- 普攻 ---------- */
function attackDamage(W, u, t) {

    if (u.hid === 'marksman') { u.atkN++; if (u.atkN % 4 === 0) { d *= 1.6; crit = true; sp = 1; } }
    const emp = fxOn(u, 'emp');
    if (emp) { d += emp.v; clearFx(u, 'emp'); crit = true; }
  }
  if (u.kind === 'tower' || u.kind === 'crystal') {
    if (t.kind === 'hero') {

  if (u.kind === 'minion' && t.kind === 'hero') d *= 0.7;

}

  if (u.kind === 'hero') {

  }
  const [d, crit, sp] = attackDamage(W, u, t);
  if (u.proj) {
    const sy = u.kind === 'tower' ? -90 : u.kind === 'crystal' ? -110 : -16;
    spawnProj(W, { kind: 'home', x: u.x, y: u.y + sy, tid: t.id, spd: u.kind === 'tower' || u.kind === 'crystal' ? 1300 : 1150,
      team: u.team, src: u.id, dmg: d, crit, sp, on: 'atk', vis: u.proj });
  } else onAttackHit(W, u, t, d, crit, sp);
  W.ev.push({ t: 'atk', id: u.id, tid: t.id, x: u.x, y: u.y, kind: u.kind, proj: u.proj || '' });
}
function onAttackHit(W, u, t, d, crit, sp) {

/* ---------- 技能 ---------- */

'use strict';
/* models.js：三维模型，全部用代码拼出来的低多边形。
   英雄：六个原创人物（战士凌锋、坦克石岳、刺客夜影、法师星璃、射手追月、辅助灵溪），髋、膝、肩、肘、头都能动。
   小兵：拆成“身子、左腿、右腿”三块，各自合并成一个带顶点色的几何体，用 InstancedMesh 一次画一批。
   野怪、龙：一组网格，身子、翅膀、尾巴能动。
   约定：模型面朝 +Z，脚底 y = 0，1 单位 = 游戏里 1 单位。 */

const MATS = {};
function lam(col, o) {
  const key = 'l' + col + (o ? JSON.stringify(o) : '');
  if (!MATS[key]) MATS[key] = new THREE.MeshLambertMaterial(Object.assign({ color: col }, o || {}));
  return MATS[key];
}
function glowMat(col, opacity) {
  const key = 'g' + col + (opacity || 1);
  if (!MATS[key]) MATS[key] = new THREE.MeshBasicMaterial({ color: col, transparent: (opacity || 1) < 1, opacity: opacity || 1, depthWrite: (opacity || 1) >= 1 });
  return MATS[key];
}
function M(geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = true;
  return m;
}
const GEO = {
  box: (w, h, d) => new THREE.BoxGeometry(w, h, d),
  cyl: (rt, rb, h, s) => new THREE.CylinderGeometry(rt, rb, h, s || 8),
  sph: (r, w, h) => new THREE.SphereGeometry(r, w || 10, h || 8),
  cone: (r, h, s) => new THREE.ConeGeometry(r, h, s || 8),
  oct: r => new THREE.OctahedronGeometry(r, 0),
  ico: (r, d) => new THREE.IcosahedronGeometry(r, d || 0),
  dod: r => new THREE.DodecahedronGeometry(r, 0),
  torus: (r, t, rs, ts, arc) => new THREE.TorusGeometry(r, t, rs || 6, ts || 12, arc || Math.PI * 2),
};
function rot(o, x, y, z) { o.rotation.set(x || 0, y || 0, z || 0); return o; }
function grp(x, y, z) { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); return g; }

/* ---------- 把一组网格烤成一个带顶点色的几何体（小兵、塔、树用） ---------- */
function bakeGroup(root) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const parts = [];
  root.traverse(o => {
    if (!o.isMesh || o.userData.noBake) return;
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(m);
    const c = o.material.color ? o.material.color.clone() : new THREE.Color('#ffffff');
    parts.push([g, c]);
  });
  let n = 0;
  for (const [g] of parts) n += g.attributes.position.count;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let o = 0;
  for (const [g, c] of parts) {
    const k = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    if (!g.attributes.normal) g.computeVertexNormals();
    nor.set(g.attributes.normal.array, o * 3);
    for (let i = 0; i < k; i++) { col[(o + i) * 3] = c.r; col[(o + i) * 3 + 1] = c.g; col[(o + i) * 3 + 2] = c.b; }
    o += k;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}
const VCOL = () => MATS.vcol || (MATS.vcol = new THREE.MeshLambertMaterial({ vertexColors: true }));

/* ---------- 人形 ---------- */
// o：配色和体型 { skin, body, belly, sleeve, forearm, pants, shin, boots, glove, belt, eye, bulk, robe, robeCol, robeTrim }
function sc3(o, x, y, z) { o.scale.set(x, y, z); return o; }
function humanoid(o) {
  const B = o.bulk || 1;
  const root = new THREE.Group();
  const body = grp(); root.add(body);
  const hips = grp(0, 41, 0); body.add(hips);
  hips.add(sc3(M(GEO.cyl(10.4 * B, 9.4 * B, 9, 10), lam(o.pants), 0, -1, 0), 1, 1, 0.75));
  const legs = [-1, 1].map(s => {
    const hip = grp(s * 5.6 * B, -2, 0); hips.add(hip);
    hip.add(M(GEO.cyl(5.1 * B, 4.2 * B, 20, 8), lam(o.pants), 0, -10, 0));
    const knee = grp(0, -20, 0); hip.add(knee);
    knee.add(M(GEO.cyl(4.3 * B, 3.6 * B, 15, 8), lam(o.shin || o.pants), 0, -7.5, 0));
    knee.add(M(GEO.cyl(4.9 * B, 4.6 * B, 6, 8), lam(o.boots), 0, -11.5, 0));
    knee.add(sc3(M(GEO.sph(5.2 * B, 10, 6), lam(o.boots), 0, -16.6, 2.4), 0.95, 0.62, 1.45));
    return { hip, knee };
  });
  const torso = grp(0, 3, 0); hips.add(torso);
  torso.add(sc3(M(GEO.cyl(9.6 * B, 9.4 * B, 11, 10), lam(o.belly || o.body), 0, 5, 0), 1, 1, 0.78));
  torso.add(sc3(M(GEO.cyl(13.4 * B, 10 * B, 17, 10), lam(o.body), 0, 18.5, 0), 1, 1, 0.74));
  torso.add(sc3(M(GEO.cyl(10.4 * B, 10.4 * B, 3.6, 10), lam(o.belt || '#5A3E24'), 0, 0.6, 0), 1, 1, 0.8));
  torso.add(M(GEO.cyl(3.8, 4.4, 6, 8), lam(o.skin), 0, 29, 0));
  if (o.robe) {                                // 长袍：腰下一圈裙摆
    torso.add(M(GEO.cyl(10.5 * B, 21 * B, 34, 12), lam(o.robeCol || o.body), 0, -16, 0));
    torso.add(M(GEO.cyl(21.2 * B, 21.6 * B, 3.4, 12), lam(o.robeTrim || o.body), 0, -32.5, 0));

    sh.add(M(GEO.cyl(4.1 * B, 3.6 * B, 14, 8), lam(o.sleeve || o.body), 0, -7, 0));
    const el = grp(0, -14, 0); sh.add(el);
    el.add(M(GEO.cyl(3.6 * B, 3.1 * B, 12, 8), lam(o.forearm || o.skin), 0, -6, 0));
    const hand = grp(0, -13, 0); el.add(hand);
    hand.add(M(GEO.sph(3.7 * B, 8, 6), lam(o.glove || o.skin), 0, 0, 0));

// 头发：一个盖住后脑的半球 + 刘海；style：spiky 刺猬头、long 长发、pony 马尾、twin 双马尾
function hair(head, col, style) {
  const c = lam(col);
  const cap = M(new THREE.SphereGeometry(11.9, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.52), c, 0, 12, -1.2);
  cap.scale.set(1.05, 1.08, 1.08); cap.rotation.x = -0.42; head.add(cap);   // 往后仰：前面只盖到额头，后面盖住后脑勺
  for (let i = -2; i <= 2; i++) {               // 刘海：几片往下垂的尖，停在眉毛上面
    const b = M(GEO.cone(3.4, 7, 4), c, i * 3.7, 18.2 - Math.abs(i) * 0.9, 9.6 - Math.abs(i) * 1.0);
    b.rotation.set(Math.PI - 0.5, 0, i * 0.2); head.add(b);
  }
  if (style === 'spiky') {
    for (const [x, y, z, rx, rz, h] of [[0, 22, 2, -0.2, 0, 15], [-6, 21, 0, -0.1, 0.5, 13], [6, 21, 0, -0.1, -0.5, 13], [-3, 21, -6, -0.7, 0.3, 14], [4, 21, -6, -0.7, -0.3, 14], [0, 18, -10, -1.2, 0, 13], [-9, 15, -4, -0.5, 0.9, 11], [9, 15, -4, -0.5, -0.9, 11]])
      head.add(rot(M(GEO.cone(4.6, h, 5), c, x, y, z), rx, 0, rz));
  } else if (style === 'long') {
    head.add(sc3(M(GEO.cyl(11.5, 13, 30, 10), c, 0, 0, -6.5), 1, 1, 0.55));
    for (const s of [-1, 1]) head.add(rot(M(GEO.box(4.5, 22, 5), c, s * 10.2, 5, 4), 0, 0, s * 0.08));
  } else if (style === 'pony') {
    head.add(M(GEO.sph(4, 8, 6), lam('#C0392B'), 0, 16, -11));
    head.add(rot(M(GEO.cone(6, 26, 8), c, 0, 4, -16), 0.5, 0, 0));
  } else if (style === 'twin') {
    for (const s of [-1, 1]) {
      head.add(M(GEO.sph(3.4, 8, 6), lam('#FFFFFF'), s * 10, 17, -5));
      head.add(rot(M(GEO.cone(5.4, 24, 8), c, s * 13.5, 4, -6), 0.25, 0, -s * 0.35));
    }
  }
  return cap;
}

/* ---------- 把一套关节（Group）换成骨骼，整个英雄烤成一个蒙皮网格：一次绘制 ---------- */
// 每个 Group 变成一根骨头，挂在它下面的网格的顶点 100% 绑在这根骨头上。会自己动的网格（法球、翅膀、光点）先包一层 Group
function wrapMesh(m) {
  const g = new THREE.Group();
  g.position.copy(m.position); g.quaternion.copy(m.quaternion); g.scale.copy(m.scale);
  const p = m.parent; p.add(g); p.remove(m);
  m.position.set(0, 0, 0); m.quaternion.identity(); m.scale.set(1, 1, 1);
  g.add(m);
  return g;
}
function skinMats(rim) {
  const lit = new THREE.MeshLambertMaterial({ vertexColors: true, skinning: true });
  lit.onBeforeCompile = sh => {           // 边缘光：人物从地上“跳”出来
    sh.uniforms.uRim = { value: rim || 0.32 };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vRimN; varying vec3 vRimV;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvRimN = normalize(normalMatrix * objectNormal); vRimV = -mvPosition.xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vRimN; varying vec3 vRimV; uniform float uRim;')
      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\nfloat rimK = 1.0 - max(0.0, dot(normalize(vRimN), normalize(vRimV)));\ngl_FragColor.rgb += uRim * pow(rimK, 2.6) * vec3(1.0, 0.97, 0.9);');
  };
  const glow = new THREE.MeshBasicMaterial({ vertexColors: true, skinning: true, transparent: true, depthWrite: true });
  return { lit, glow };
}
function rigToSkinned(h, rim) {
  for (const k of ['orb']) if (h[k] && h[k].isMesh) h[k] = wrapMesh(h[k]);
  for (const k of ['wings', 'motes']) if (h[k]) h[k] = h[k].map(m => (m.isMesh ? wrapMesh(m) : m));
  const bones = [], map = new Map();
  const visit = (o, pb) => {
    if (o.isMesh) return;
    const b = new THREE.Bone();
    b.position.copy(o.position); b.quaternion.copy(o.quaternion); b.scale.copy(o.scale);
    map.set(o, b); bones.push(b);
    if (pb) pb.add(b);
    for (const c of o.children.slice()) visit(c, b);
  };
  visit(h.root, null);
  h.root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(h.root.matrixWorld).invert();
  const sets = { lit: [], glow: [] };
  h.root.traverse(o => {
    if (!o.isMesh) return;
    const bi = bones.indexOf(map.get(o.parent));
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    const glow = !!o.material.isMeshBasicMaterial;
    sets[glow ? 'glow' : 'lit'].push([o.geometry, o.material.color, m, bi, glow ? o.material.opacity : 1]);
  });
  const build = list => {
    let n = 0;
    const gs = list.map(([g, c, m, bi, a]) => { const q = g.index ? g.toNonIndexed() : g.clone(); q.applyMatrix4(m); n += q.attributes.position.count; return [q, c, bi, a]; });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 4), si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
    let o = 0;
    for (const [q, c, bi, a] of gs) {
      const k = q.attributes.position.count;
      pos.set(q.attributes.position.array, o * 3);
      if (!q.attributes.normal) q.computeVertexNormals();
      nor.set(q.attributes.normal.array, o * 3);
      for (let i = 0; i < k; i++) { const j = o + i; col[j * 4] = c.r; col[j * 4 + 1] = c.g; col[j * 4 + 2] = c.b; col[j * 4 + 3] = a; si[j * 4] = bi; sw[j * 4] = 1; }
      o += k;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 4));
    g.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
    g.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
    g.computeBoundingSphere();
    g.boundingSphere.radius *= 1.8;            // 动起来会伸出去一点
    return g;
  };
  const mats = skinMats(rim);
  const mesh = new THREE.SkinnedMesh(build(sets.lit), mats.lit);
  mesh.castShadow = true;
  mesh.add(bones[0]);
  const skel = new THREE.Skeleton(bones);
  mesh.bind(skel);
  let glow = null;
  if (sets.glow.length) {
    glow = new THREE.SkinnedMesh(build(sets.glow), mats.glow);
    glow.castShadow = false;
    mesh.add(glow);
    glow.bind(skel, new THREE.Matrix4());
  }
  // 原来的引用全部换成对应的骨头
  const B = o => map.get(o) || o;
  for (const k of ['body', 'hips', 'torso', 'head', 'weapon', 'scarf', 'cape', 'orb']) if (h[k]) h[k] = B(h[k]);
  if (h.legs) h.legs = h.legs.map(l => ({ hip: B(l.hip), knee: B(l.knee) }));
  if (h.arms) h.arms = h.arms.map(a => ({ sh: B(a.sh), el: B(a.el), hand: B(a.hand) }));
  for (const k of ['wings', 'motes']) if (h[k]) h[k] = h[k].map(B);
  if (h.parts) for (const k in h.parts) h.parts[k] = Array.isArray(h.parts[k]) ? h.parts[k].map(B) : B(h.parts[k]);
  h.root = mesh; h.mesh = mesh; h.glow = glow; h.mats = mats;
  return h;
}

/* ---------- 英雄动画 ---------- */
// s：{ move 0~1, atk 普攻开始后的秒数（没有为 -1）, cast 放技能后的秒数, stun, dead 死后的秒数, spin }
function animHero(h, s, t) {
  const [L, R] = h.arms, [LL, LR] = h.legs;
  for (const a of h.arms) { a.sh.rotation.set(0, 0, 0); a.el.rotation.set(0, 0, 0); }
  for (const l of h.legs) { l.hip.rotation.set(0, 0, 0); l.knee.rotation.set(0, 0, 0); }
  h.torso.rotation.set(0, 0, 0); h.head.rotation.set(0, 0, 0); h.body.position.set(0, 0, 0); h.body.rotation.set(0, 0, 0);
  const mv = s.move;
  const ph = t * 11;
  if (mv > 0.01) {                               // 跑
    const sw = Math.sin(ph);
    LL.hip.rotation.x = -sw * 0.85 * mv; LR.hip.rotation.x = sw * 0.85 * mv;
    LL.knee.rotation.x = Math.max(0, Math.sin(ph + 1.6)) * 1.2 * mv; LR.knee.rotation.x = Math.max(0, -Math.sin(ph + 1.6)) * 1.2 * mv;
    L.sh.rotation.x = sw * 0.7 * mv; R.sh.rotation.x = -sw * 0.7 * mv;
    L.el.rotation.x = -0.6 * mv; R.el.rotation.x = -0.6 * mv;
    h.body.position.y = Math.abs(Math.cos(ph)) * 3 * mv;
    h.torso.rotation.x = 0.16 * mv;
    h.torso.rotation.y = sw * 0.12 * mv;
  } else {                                       // 站着：呼吸
    h.body.position.y = Math.sin(t * 2.2) * 0.7;
    L.sh.rotation.z = -0.12; R.sh.rotation.z = 0.12;
    L.el.rotation.x = -0.18; R.el.rotation.x = -0.3;
    h.torso.rotation.x = Math.sin(t * 2.2) * 0.02;
  }
  if (h.wkind === 'bow') { L.sh.rotation.x += -0.45; L.el.rotation.x += -0.5; }
  if (h.wkind === 'staff') { R.el.rotation.x += -0.7; }
  if (h.wkind === 'mace' || h.wkind === 'sword') { R.el.rotation.x += -0.5; }
  if (h.hid === 'tank') { L.el.rotation.x += -1.0; L.sh.rotation.x += -0.2; }
  if (s.atk >= 0 && s.atk < 0.42) {              // 普攻
    const p = s.atk / 0.36;
    if (h.wkind === 'sword' || h.wkind === 'mace') {
      const up = p < 0.35 ? p / 0.35 : 0, down = p >= 0.35 ? Math.min(1, (p - 0.35) / 0.25) : 0;
      R.sh.rotation.x = p < 0.35 ? -2.6 * up : p < 1 ? -2.6 + 3.1 * down : 0;
      R.el.rotation.x = -0.4;
      h.torso.rotation.y = p < 0.35 ? -0.35 * up : p < 1 ? -0.35 + 0.8 * down : 0;
    } else if (h.wkind === 'dagger') {
      const a = Math.sin(Math.min(1, p) * Math.PI);
      (p < 0.5 ? R : L).sh.rotation.x = -1.5 * a; (p < 0.5 ? R : L).el.rotation.x = 0.1;
      h.torso.rotation.y = (p < 0.5 ? 0.3 : -0.3) * a;
    } else if (h.wkind === 'bow') {
      L.sh.rotation.x = -1.55; L.el.rotation.x = 0; L.sh.rotation.y = 0.2;
      const pull = p < 0.6 ? p / 0.6 : 0;
      R.sh.rotation.x = -1.5; R.el.rotation.x = -1.8 * pull; R.sh.rotation.y = -0.3;
      h.torso.rotation.y = -0.4;
    } else {
      const a = Math.sin(Math.min(1, p) * Math.PI);
      R.sh.rotation.x = -1.4 * a; R.el.rotation.x = -0.3 * (1 - a);
      h.torso.rotation.y = 0.2 * a;
    }
  }
  if (s.cast >= 0 && s.cast < 0.45) {            // 放技能：双手举起
    const a = Math.sin(Math.min(1, s.cast / 0.45) * Math.PI);
    L.sh.rotation.x = -2.5 * a; R.sh.rotation.x = -2.5 * a;
    L.sh.rotation.z = -0.4 * a; R.sh.rotation.z = 0.4 * a;
  }
  if (s.spin) { h.body.rotation.y = t * 18; R.sh.rotation.z = 1.3; R.sh.rotation.x = -0.2; L.sh.rotation.z = -1.1; }
  if (s.stun) { h.head.rotation.z = Math.sin(t * 7) * 0.25; h.torso.rotation.z = Math.sin(t * 7) * 0.06; L.sh.rotation.x = 0.2; R.sh.rotation.x = 0.2; }
  if (h.scarf) h.scarf.rotation.x = -0.2 - mv * 0.55 + Math.sin(t * 9) * 0.08;
  if (h.cape) h.cape.rotation.x = -mv * 0.38 + Math.sin(t * 6) * 0.04;
  if (h.wings) h.wings.forEach((w, i) => { w.rotation.y = (i ? -1 : 1) * (0.45 + Math.sin(t * 6) * 0.28); });
  if (h.orb) h.orb.rotation.y = t * 2;
  if (h.motes) h.motes.forEach((m, i) => { const a = t * 2.2 + i * Math.PI * 2 / 3; m.position.set(Math.cos(a) * 28, 66 + Math.sin(t * 3 + i * 2) * 6, Math.sin(a) * 28); });
  if (s.dead >= 0) {                             // 倒下
    const k = Math.min(1, s.dead / 0.4);
    h.body.rotation.x = -k * Math.PI / 2;
    h.body.position.y = 8 * k;
    h.body.position.z = -30 * k;
  }
}

  if (hole) shp.holes.push(new THREE.Path(hole.map(p => new THREE.Vector2(p[0], -p[1]))));

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const qx = Math.round(x * 2), qz = Math.round(z * 2), qy = Math.round(y * 2);

/* ---------- 技能瞄准：地上的范围圈、方向箭头、落点圈 ---------- */
function syncAim(me, aim) {
  if (!R3.aimG) R3.aimG = { range: null, arrow: null, spot: null, tgt: null };
  const A = R3.aimG;
  const hide = () => { for (const k in A) if (A[k]) { freeDecal(A[k]); A[k] = null; } };
  if (!aim || !me || me.dead) { hide(); return; }
  const col = aim.cancel ? '#FF4A4A' : '#9CD8FF';
  const need = (k, kind) => { if (!A[k]) A[k] = decal(kind, col, { op: 0.9 }); A[k].mesh.material.color.set(col); return A[k]; };
  const drop = k => { if (A[k]) { freeDecal(A[k]); A[k] = null; } };
  const flash = aim.s === 'flash';
  const def = flash ? { aim: 'dir', range: FLASH_DIST } : sdef(me, aim.s);
  const range = def.range;
  if (range < 2000) placeDecal(need('range', 'dash'), me.x, me.y, range * 2 + (def.aim === 'self' ? 0 : 60));
  else drop('range');
  const dx = aim.dx, dy = aim.dy;
  if (def.aim === 'dir') {
    const len = Math.min(range, 1800), w = flash ? 60 : (def.id === 's1' ? 120 : def.id === 's3' ? 110 : def.id === 'w3' ? 180 : 80);
    const a = need('arrow', 'arrow');
    placeDecal(a, me.x + dx * len / 2, me.y + dy * len / 2, w, len, Math.atan2(dx, dy) + Math.PI, 5);
    a.mesh.material.opacity = 0.85;
    drop('spot'); drop('tgt');
  } else if (def.aim === 'point') {
    const r = def.rad || 120, d = aim.mag * range;
    placeDecal(need('spot', 'disc'), me.x + dx * d, me.y + dy * d, r * 2);
    drop('arrow'); drop('tgt');
  } else if (def.aim === 'unit') {
    drop('arrow'); drop('spot');
    if (aim.tgt) placeDecal(need('tgt', 'ring'), aim.tgt.x, aim.tgt.y, 110); else drop('tgt');
  } else { drop('arrow'); drop('spot'); drop('tgt'); }
}

// follow：镜头跟谁；me：玩家（可能为空）；aim：正在瞄的技能（INP.aim）
function render3D(W, follow, me, dt, aim) {
  R3.t += dt;
  R3.W = W; R3.me = me;
  S3.uWind.value = R3.t;
  if (S3.water) S3.water.material.uniforms.uT.value = R3.t;
  // 镜头
  let tx = follow ? follow.x : R3.camX, ty = follow ? follow.y : R3.camY;
  if (R3.peek) { tx = R3.peek[0]; ty = R3.peek[1]; }
  else if (R3.aimCam) { tx += R3.aimCam[0]; ty += R3.aimCam[1]; }
  const kk = R3.peek ? 1 - Math.exp(-dt * 14) : 1 - Math.exp(-dt * 7);

  R3.camX = clamp(R3.camX, 300, L - 300); R3.camY = clamp(R3.camY, 380, L - 200);
  R3.shake = Math.max(0, R3.shake - dt * 18);
  const sh = R3.shake > 0 ? [(Math.random() - 0.5) * R3.shake * 3, (Math.random() - 0.5) * R3.shake * 3] : null;
  placeCamera(R3.camX, R3.camY, sh);
  S3.cam.updateMatrixWorld();
  // 看得见的范围（地面上的外框，放宽一点）
  const c1 = screenToGround(0, 0) || [R3.camX - 1500, R3.camY - 1500], c2 = screenToGround(S3.w, 0) || [R3.camX + 1500, R3.camY - 1500];
  const c3 = screenToGround(0, S3.h) || [R3.camX - 1000, R3.camY + 600], c4 = screenToGround(S3.w, S3.h) || [R3.camX + 1000, R3.camY + 600];
  R3.view = [Math.min(c1[0], c3[0]) - 250, Math.min(c1[1], c2[1]) - 250, Math.max(c2[0], c4[0]) + 250, Math.max(c3[1], c4[1]) + 320];
  const [vx0, vy0, vx1, vy1] = R3.view;
  const inView = u => u.x > vx0 && u.x < vx1 && u.y > vy0 && u.y < vy1;
  const myTeam = me ? me.team : 0;
  R3.bars.length = 0;
  // 草丛：玩家在哪丛，哪丛变透明
  const myBush = me && !me.dead ? bushOf(me.x, me.y) : 0;
  for (const b of S3.bushes) {
    const fade = b.idx === myBush;
    if (fade !== b.mat.transparent) { b.mat.transparent = fade; b.mat.opacity = fade ? 0.42 : 1; b.mat.depthWrite = !fade; b.mat.needsUpdate = true; }
  }
  for (const u of W.units) {
    if (u.kind === 'hero') {
      let v = R3.heroes.get(u.id);
      if (!v) { v = makeHeroVis(u); R3.heroes.set(u.id, v); }
      const vis = canSee(W, myTeam, u) && inView(u);
      syncHero(W, u, v, me, dt, vis);
      if (vis && !u.dead) R3.bars.push(u);
    } else if (u.kind === 'monster') {
      let v = R3.monsters.get(u.id);
      if (!v) {
        const rig = rigToSkinned(buildMonster(u.mt), 0.18);
        rig.root.scale.setScalar(MON_SCALE[u.mt] || 1);
        R3.scene.add(rig.root);
        v = { u, rig, yaw: Math.atan2(L / 2 - u.x, L / 2 - u.y), lx: u.x, ly: u.y, spd: 0 };
        R3.monsters.set(u.id, v);
      }
      const vis = inView(u);
      v.rig.root.visible = vis;
      if (vis) syncMonster(W, u, v, dt);
      if (vis && !u.dead) R3.bars.push(u);
    } else if (u.kind === 'tower' || u.kind === 'crystal') {
      let s = R3.structs.get(u.id);
      if (!s) {
        const vis = u.kind === 'tower' ? buildTower(u.team, u.tier) : buildCrystal(u.team);
        vis.root.position.set(u.x, 0, u.y);
        if (u.kind === 'tower') vis.root.scale.setScalar(1.25);
        R3.scene.add(vis.root);
        s = { vis, fallen: 0, rubble: null };
        R3.structs.set(u.id, s);
      }
      if (inView(u)) syncStruct(W, u, s, me);
      if (!u.dead && inView(u)) R3.bars.push(u);
    } else if (u.kind === 'minion' && !u.dead && inView(u)) R3.bars.push(u);
  }
  // 死了、已经从 W.units 里拿掉的野怪
  for (const [id, v] of R3.monsters) {
    if (!W._byId.has(id)) {
      v.gone = (v.gone || 0) + dt;
      if (v.gone > 1.2) { R3.scene.remove(v.rig.root); disposeRig(v.rig); R3.monsters.delete(id); }
      else { v.u.dead = true; syncMonster(W, v.u, v, dt); }
    }
  }
  syncMinions(W, dt);
  syncProjs(W, dt);
  syncZones(W);
  // 敌方塔的攻击范围：玩家走近了才显示
  const tr = R3.towerRing;
  tr.mesh.visible = false;
  if (me && !me.dead) {
    let best = null, bd = 1e9;
    for (const u of W.units) {
      if ((u.kind !== 'tower' && u.kind !== 'crystal') || u.dead || u.team === me.team) continue;
      const d = Math.hypot(u.x - me.x, u.y - me.y);
      if (d < u.range + 260 && d < bd) { bd = d; best = u; }
    }
    if (best) {
      tr.mesh.visible = true;
      placeDecal(tr, best.x, best.y, (best.range + me.r) * 2, null, R3.t * 0.2, 2);
      const tgt = best.tgt === me.id;
      tr.mesh.material.opacity = tgt ? 0.95 : 0.6;
      if (tgt && Math.random() < 0.3) part(true, me.x, groundH(me.x, me.y) + 4, me.y, 0, 0, 0, 0.3, 120, '#FF3A2A', 0, -0.3);
    }
  }
  syncAim(me, aim);
  stepFx(dt);
  stepParticles(R3.pa, dt);
  stepParticles(R3.pn, dt);
  const sc = S3.h * S3.dpr * 0.5 / Math.tan(S3.cam.fov * Math.PI / 360);
  R3.pa.mat.uniforms.uScale.value = sc; R3.pn.mat.uniforms.uScale.value = sc;
  S3.r.render(S3.scene, S3.cam);
}
// 单位头顶在屏幕上的位置（画血条用）
function unitTop(u) {

/* ---------- 头像：把英雄的半身渲到一张小图上（选人、对阵、击杀播报、小地图用） ---------- */
function heroPortraits(size) {
  const out = {};
  const r = S3.r, N = size * 2;
  const rt = new THREE.WebGLRenderTarget(N, N);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight('#FFFFFF', '#7A6A5A', 0.75));
  const dl = new THREE.DirectionalLight('#FFF6E8', 0.75); dl.position.set(-0.5, 0.8, 1); sc.add(dl);
  const cam = new THREE.PerspectiveCamera(30, 1, 10, 2000);
  const buf = new Uint8Array(N * N * 4);
  for (const hd of HEROES) {
    const rig = rigToSkinned(buildHero(hd.id));
    animHero(rig, { move: 0, atk: -1, cast: -1, stun: false, dead: -1 }, 0.4);
    rig.root.rotation.y = hd.id === 'warrior' || hd.id === 'mage' || hd.id === 'support' ? 0.45 : -0.35;   // 武器别挡脸
    sc.add(rig.root);
    rig.root.updateMatrixWorld(true);
    cam.position.set(0, 108, 118); cam.lookAt(0, 82, 0);
    r.setRenderTarget(rt);
    r.setClearColor(0x000000, 0);
    r.clear();
    r.render(sc, cam);
    r.readRenderTargetPixels(rt, 0, 0, N, N, buf);
    r.setRenderTarget(null);
    sc.remove(rig.root);
    const c = mkc(N, N), g = c.getContext('2d'), im = g.createImageData(N, N);
    for (let y = 0; y < N; y++) im.data.set(buf.subarray((N - 1 - y) * N * 4, (N - y) * N * 4), y * N * 4);
    g.putImageData(im, 0, 0);
    const o = mkc(size, size), og = o.getContext('2d');
    og.imageSmoothingQuality = 'high';
    og.drawImage(c, 0, 0, size, size);
    out[hd.id] = o;
  }
  r.setClearColor(0x000000, 1);
  rt.dispose();
  return out;
}

'use strict';

   镜头是斜着往下看的：屏幕上往上拖一段，对应地上往北走得更远一点（除以俯角的正弦），这样指的方向和看到的方向一致。

function onPointerDown(W, me, id, x, y) {

  if (hitBtn(Lt.pause, x, y, 10)) { INP.onPause && INP.onPause(); return; }
  if (hitBtn(Lt.shop, x, y, 6)) { INP.onShop && INP.onShop(); return; }
  if (HUD.nb && hitBtn(Lt.buy, x, y, 6)) { if (!buy(W, me, HUD.nb)) toast('金币不够', C.dim); return; }
  if (me.dead) { if (x < HUD.w * 0.45) startJoy(id, x, y); return; }
  if (hitBtn(Lt.atk, x, y, 10)) { INP.atk = id; INP.ptr[id] = { role: 'atk' }; return; }
  for (let s = 0; s < 3; s++) {
    if (hitBtn(Lt.s[s], x, y, 7)) {
      const st = me.sk[s];
      if (!st.rank) { toast(s === 2 ? '4 级解锁大招' : '2 级解锁这个技能', C.dim); return; }
      if (st.cd > 0) { toast('技能冷却中', C.dim); return; }

    if (st.cd > 0) { toast('技能冷却中', C.dim); return; }

'use strict';

const SFX_GAP = { hit: 0.035, swing: 0.04, shoot: 0.04, tower: 0.08, coin: 0.05, pop: 0.05, magic: 0.05, heart: 0.06, boom: 0.06, thud: 0.06 };
// x, y：世界坐标（null = 不按距离衰减）
function sfx(name, x, y, vol) {
  if (!AU.ctx || !AU.on || !SYN[name]) return;
  const now = AU.ctx.currentTime;
  if (AU.last[name] && now - AU.last[name] < (SFX_GAP[name] || 0.02)) return;
  let v = vol == null ? 1 : vol;
  if (x != null) {
    const d = Math.hypot(x - AU.camX, y - AU.camY);
    v *= clamp(1 - (d - 450) / 1300, 0, 1);
    if (v < 0.04) return;
  }
  AU.last[name] = now;
  SYN[name](now + 0.005, v, AU.sfxBus);
}
// 播报语音：一句一句来，后来的排队（最多排两句）
function sayVoice(id) {
  if (!AU.ctx || !AU.on) return;
  const b = AU.voices[id];
  if (!b) return;
  const now = AU.ctx.currentTime;
  if (AU.playing && AU.playing.end > now + 0.05) {
    if (AU.queue.length < 2) AU.queue.push(id); else AU.queue[1] = id;   // 排满了：换掉后面那句，最新的先播
    return;
  }
  const s = AU.ctx.createBufferSource();
  s.buffer = b; s.connect(AU.voiceBus); s.start(now);
  AU.playing = { end: now + b.duration };
  AU.sfxBus.gain.setTargetAtTime(0.32, now, 0.05);
  AU.sfxBus.gain.setTargetAtTime(0.6, now + b.duration, 0.15);
  s.onended = () => { AU.playing = null; const n = AU.queue.shift(); if (n) sayVoice(n); };
}

/* ---------- 对阵、开局 ---------- */
function rosters(hid, seed) {
  // 蓝方：我 + 另外 4 个（6 个英雄里去掉一个）；红方：随机去掉一个
  const others = HEROES.map(h => h.id).filter(id => id !== hid);
  let r = seed;
  const rnd2 = () => { r = (r * 16807) % 2147483647; return r / 2147483647; };
  const dropB = others[Math.floor(rnd2() * others.length)];
  const blue = [hid, ...others.filter(id => id !== dropB)];
  const all = HEROES.map(h => h.id);
  const dropR = all[Math.floor(rnd2() * all.length)];
  const red = all.filter(id => id !== dropR);
  for (let i = red.length - 1; i > 0; i--) { const j = Math.floor(rnd2() * (i + 1)); [red[i], red[j]] = [red[j], red[i]]; }
  return { blue, red };
}
function startLoading() {
  const seed = (Date.now() % 100000) + 7;
  const { blue, red } = rosters(G.hero, seed);
  const s = $('#vs');
  const row = (list, team) => list.map((hid, i) => `<div class="vsh ${team ? 'r' : 'b'} ${team === 0 && i === 0 ? 'me' : ''}"><img src="${pimg(hid)}" alt=""><span>${HERO_BY_ID[hid].name}</span><small>${team === 0 && i === 0 ? '你' : '电脑'}</small></div>`).join('');
  s.innerHTML = `<div class="vsrow">${row(blue, 0)}</div><div class="vsmid"><span class="vb">蓝方</span><b>VS</b><span class="vr">红方</span></div><div class="vsrow">${row(red, 1)}</div>
    <div class="load"><div class="bar"><i id="ldbar"></i></div><span id="ldtxt">加载中 0%</span></div>`;
  show('vs');
  // 对局在后面先建好、先画一帧（着色器编译放在这时候），再揭开
  setTimeout(() => { prepGame(blue, red, seed); }, 60);
  let p = 0;
  const tick = () => {
    p = Math.min(100, p + 8 + Math.random() * 12);
    const bar = $('#ldbar'); if (bar) bar.style.width = p + '%';
    const tx = $('#ldtxt'); if (tx) tx.textContent = '加载中 ' + Math.floor(p) + '%';
    if (p < 100 || !G.W) setTimeout(tick, 100);
    else setTimeout(() => { hideAll(); G.scr = 'game'; G.paused = false; G.last = performance.now(); }, 300);
  };
  tick();
}
function prepGame(blue, red, seed) {
  reset3D();
  G.W = newWorld({ blue, red, player: 0, diff: G.diff, seed });
  G.me = G.W.units.find(u => u.isPlayer);
  G.demo = null;
  HUD.ann.length = 0; HUD.feed.length = 0; HUD.floats.length = 0; HUD.toasts.length = 0;
  R3.camX = G.me.x; R3.camY = G.me.y;
  G.endShown = false; G.acc = 0; G.crystalWarnT = -99;
  inpReset();
  render3D(G.W, G.me, G.me, 0, null);
}

function board(W) {
  const row = h => `<tr class="${h.team ? 'r' : 'b'} ${h.isPlayer ? 'me' : ''}"><td><img src="${pimg(h.hid)}" alt=""></td><td>${HERO_BY_ID[h.hid].name}${h.isPlayer ? '（你）' : ''}</td><td>${h.lvl}</td><td>${h.kills}/${h.deaths}/${h.assists}</td><td>${Math.round(h.goldTotal)}</td><td class="its">${h.items.map(i => `<img src="${iimg(i)}" alt="${ITEMS[i].name}">`).join('')}</td></tr>`;
  return `<table class="board"><tr><th></th><th>英雄</th><th>级</th><th>击杀/死亡/助攻</th><th>经济</th><th>装备</th></tr>${W._heroes.filter(h => h.team === 0).map(row).join('')}<tr class="gap"><td colspan="6"></td></tr>${W._heroes.filter(h => h.team === 1).map(row).join('')}</table>`;
}
function openPause() {
  if (G.scr !== 'game' || G.W.winner >= 0) return;
  G.paused = true; inpReset();
  const s = $('#pause');
  s.innerHTML = `<div class="box wide"><div class="hd">暂停 <small>${fmtTime(G.W.t)} · 蓝 ${G.W.kills[0]} : ${G.W.kills[1]} 红</small></div>
    <div class="row"><button class="btn" id="pResume">继续</button><button class="btn sm" id="pSound">${AU.on ? '音效：开' : '音效：关'}</button><button class="btn sm red" id="pQuit">投降</button></div>
    ${board(G.W)}</div>`;
  show('pause');
  $('#pResume').onclick = () => { sfx('click'); closePause(); };
  $('#pSound').onclick = () => { setSound(!AU.on); savePrefs(); $('#pSound').textContent = AU.on ? '音效：开' : '音效：关'; };
  $('#pQuit').onclick = () => { sfx('click'); G.paused = false; hideAll(); G.scr = 'game'; surrender(); };
}
function closePause() { if (G.rotate) return; G.paused = false; hideAll(); G.scr = 'game'; G.last = performance.now(); }
function surrender() {
  const c = G.W.units.find(u => u.kind === 'crystal' && u.team === 0);
  if (c && !c.dead) { c.inv = false; hurt(G.W, null, c, 1e9, 't', { force: 1 }); }
}
function openShop() {
  if (G.scr !== 'game') return;
  inpReset();
  renderShop(null);
  show('shop');
}
function renderShop(sel) {
  const me = G.me, s = $('#shop');
  const nb = nextBuy(me);
  sel = sel || (nb && nb.id) || 'sword';
  const cats = [['推荐', HERO_BY_ID[me.hid].build], ['攻击', Object.keys(ITEMS).filter(k => ITEMS[k].cat === 'atk')], ['法术', Object.keys(ITEMS).filter(k => ITEMS[k].cat === 'mag')], ['防御', Object.keys(ITEMS).filter(k => ITEMS[k].cat === 'def')], ['移动', Object.keys(ITEMS).filter(k => ITEMS[k].cat === 'move')]];
  const I = ITEMS[sel];
  const have = me.items.slice(), owned = [];
  for (const c of I.from || []) { const i = have.indexOf(c); if (i >= 0) { owned.push(c); have.splice(i, 1); } }
  const price = I.cost - owned.reduce((a, c) => a + ITEMS[c].cost, 0);
  const full = me.items.length - owned.length >= 6;
  const stats = Object.keys(STAT_NAME).filter(k => I[k]).map(k => `+${I[k]}${['as', 'crit', 'critd', 'ls', 'cdr', 'apen', 'mpen'].includes(k) ? '%' : ''} ${STAT_NAME[k]}`);
  if (I.thorn) stats.push(`受到普攻时反弹 ${I.thorn}% 伤害`);
  if (I.frost) stats.push('技能打中英雄会减速');
  s.innerHTML = `<div class="box wide shopbox"><div class="hd">商店 <small>金币 ${Math.floor(me.gold)} · 随时能买</small><button class="x" id="sClose">关闭</button></div>
    <div class="shopwrap"><div class="shoplist">${cats.map(([nm, ids]) => `<div class="cat">${nm}</div><div class="its">${ids.map(id => `<button class="it ${id === sel ? 'on' : ''} ${me.items.includes(id) ? 'own' : ''}" data-i="${id}"><img src="${iimg(id)}" alt=""><span>${ITEMS[id].name}</span><small>${ITEMS[id].cost}</small></button>`).join('')}</div>`).join('')}</div>
    <div class="shopd"><img src="${iimg(sel)}" alt=""><div class="dn" style="font-size:20px;letter-spacing:2px">${I.name}</div><div>${stats.join('<br>')}</div>
    ${I.from ? `<div class="from">合成：${I.from.map(c => ITEMS[c].name).join(' + ')} + ${I.cost - I.from.reduce((a, c) => a + ITEMS[c].cost, 0)} 金</div>` : ''}
    <div class="inv">身上：${me.items.map(i => `<img src="${iimg(i)}" alt="${ITEMS[i].name}">`).join('') || '还没有装备'}</div>
    <button class="btn" id="sBuy" ${me.gold >= price && !full ? '' : 'disabled'}>${full ? '格子满了' : `购买 ${price} 金`}</button></div></div></div>`;
  for (const b of s.querySelectorAll('.it')) b.onclick = () => { sfx('click'); renderShop(b.dataset.i); };
  $('#sClose').onclick = () => { sfx('click'); hideAll(); G.scr = 'game'; };
  $('#sBuy').onclick = () => { if (buy(G.W, me, { id: sel, price, use: owned })) { sfx('coin'); renderShop(sel); } };
}
function showResult() {
  const W = G.W, win = W.winner === 0;
  if (win) G.stats.win++; else G.stats.lose++;
  savePrefs();
  const score = h => h.kills * 3 + h.assists * 1.5 - h.deaths * 1.2 + h.dmgH / 900 + h.goldTotal / 2500;
  const mvp = W._heroes.filter(h => h.team === W.winner).sort((a, b) => score(b) - score(a))[0];
  const me = G.me;
  const s = $('#result');
  s.innerHTML = `<div class="box wide"><div class="res ${win ? 'win' : 'lose'}">${win ? '胜利' : '失败'}</div>
    <div class="sub">用时 ${fmtTime(W.t)} · 蓝 ${W.kills[0]} : ${W.kills[1]} 红 · 你 ${me.kills}/${me.deaths}/${me.assists}${mvp ? ` · MVP：${HERO_BY_ID[mvp.hid].name}${mvp.isPlayer ? '（你）' : ''}` : ''}</div>
    <div class="row"><button class="btn" id="rAgain">再来一局</button><button class="btn sm" id="rHome">返回主页</button></div>
    ${board(W)}</div>`;
  show('result');
  $('#rAgain').onclick = () => { sfx('click'); startDemo(); buildSelect(); show('select'); };
  $('#rHome').onclick = () => { sfx('click'); startDemo(); buildTitle(); show('title'); };
}

/* ---------- 开头背景：电脑打电脑的真对局 ---------- */
function startDemo() {
  reset3D();
  const ids = HEROES.map(h => h.id);
  const sd = (Date.now() % 9999) + 1;
  G.demo = newWorld({ blue: ids.slice(0, 5), red: ids.slice(1), player: -1, diff: 1, seed: sd });
  for (let i = 0; i < 70 * 30; i++) { step(G.demo, 1 / 30); G.demo.ev.length = 0; }   // 快进 70 秒，开头就有兵线在打
  G.demoT = 0; G.demoCam = G.demo._heroes[0];
  R3.camX = G.demoCam.x; R3.camY = G.demoCam.y;
  G.W = null; G.me = null;
}

/* ---------- 事件 → 特效、声音、播报 ---------- */
const SPREE = { 3: ['大杀特杀', 'spree3'], 4: ['主宰比赛', 'spree4'], 5: ['杀人如麻', 'spree5'], 6: ['无人能挡', 'spree6'], 7: ['横扫千军', 'spree7'] };
const MULTI = { 2: ['双杀', 'double'], 3: ['三杀', 'triple'], 4: ['四杀', 'quadra'], 5: ['五杀', 'penta'] };
const CAST_SFX = { t1: 'dash', t2: 'shield', t3: 'big', w1: 'whirl', w2: 'dash', w3: 'big', a1: 'dash', a2: 'stealth', a3: 'big', m1: 'fire', m2: 'ice', m3: 'meteor', s1: 'shoot', s2: 'dash', s3: 'big', h1: 'heal', h2: 'magic', h3: 'shield' };
function handleEvents(W, me, quiet) {
  for (const e of W.ev) {
    switch (e.t) {
      case 'dmg': {
        if (quiet) break;
        if (me && e.src === me.id && e.v >= 1) {
          const col = e.crit ? '#FFC23A' : e.ty === 'm' ? '#D9A8FF' : e.ty === 't' ? '#FFFFFF' : '#FFF4E0';
          const u = byId(W, e.id);
          floatText(e.x, e.y, u ? unitTop(u) * 0.75 : 80, String(Math.round(e.v)), col, { size: e.crit ? 21 : 15, crit: e.crit });
        } else if (me && e.id === me.id && e.v >= 1) {
          floatText(me.x, me.y, 110, '-' + Math.round(e.v), '#FF6A5A', { size: 14 });
          if (e.v > me.maxHp * 0.12) R3.shake = Math.max(R3.shake, 3);
        }
        const u = byId(W, e.id);
        if (u && u.kind === 'crystal' && u.team === 0 && W.t - G.crystalWarnT > 20 && e.src) {
          const s = byId(W, e.src); if (s && s.team === 1) { G.crystalWarnT = W.t; announce('我方水晶正在遭受攻击', C.red, { voice: 'crystal' }); }
        }
        if (u && (u.kind === 'hero' || u.kind === 'monster' || u.kind === 'tower' || u.kind === 'crystal')) sfx('hit', e.x, e.y, e.crit ? 1 : 0.55);
        break;
      }
      case 'heal': if (!quiet && me && e.id === me.id && e.v >= 20) floatText(me.x, me.y, 120, '+' + Math.round(e.v), '#7CFF7C', { size: 14 }); break;
      case 'gold': if (!quiet && me && e.id === me.id) { floatText(me.x + 30, me.y, 140, '+' + e.v, C.gold, { size: 13, dur: 0.8 }); sfx('coin', null, null, 0.5); } break;
      case 'lvl': {
        fx3Unit(W, e);
        if (!quiet && me && e.id === me.id) {
          sfx('levelup');
          floatText(me.x, me.y, 175, '升级', C.gold2, { size: 18, dur: 1.2 });
          const s = SKILL_ORDER[e.lvl - 1]; if (s != null) HUD.lvlFlash[s] = 0.9;
          if (e.lvl === 2) toast('解锁了第二个技能', C.gold2);
          if (e.lvl === 4) toast('大招解锁了！', C.gold2);
        }
        break;
      }
      case 'atk': {
        if (quiet) break;
        if (e.kind === 'hero') sfx(e.proj === 'arrow' ? 'shoot' : e.proj === 'orb' ? 'magic' : e.proj === 'heart' ? 'heart' : 'swing', e.x, e.y, 0.7);
        else if (e.kind === 'tower' || e.kind === 'crystal') sfx('tower', e.x, e.y, 0.8);
        else if (e.kind === 'monster') sfx('swing', e.x, e.y, 0.5);
        break;
      }
      case 'cast': { fx3Unit(W, e); const h = byId(W, e.id); if (!quiet && h) sfx(CAST_SFX[e.sid], h.x, h.y, 0.9); break; }
      case 'fx': {
        fx3Event(W, e);
        if (quiet) break;
        const snd = { quake: 'boom', land: 'thud', boom: 'boom', ice: 'ice', meteorHit: 'boom', bonk: 'stun', blink: 'flash', flash: 'flash', cut: 'swing', dome: 'shield' }[e.k];
        if (snd) sfx(snd, e.x, e.y, e.k === 'meteorHit' ? 0.45 : e.k === 'boom' ? 0.6 : 0.9);
        if (e.k === 'quake') R3.shake = Math.max(R3.shake, 5);
        break;
      }
      case 'die': {
        fx3Unit(W, e);
        if (quiet) break;
        if (e.kind === 'hero') sfx('death', e.x, e.y);
        else if (e.kind === 'minion') sfx('pop', e.x, e.y, 0.5);
        else if (e.kind === 'tower' || e.kind === 'crystal') { sfx('crumble', e.x, e.y, 1); R3.shake = 7; }
        break;
      }
      case 'kill': if (!quiet) killEvent(W, me, e); break;
      case 'tower': if (!quiet) { const mine = e.team === 0; announce(mine ? '我方防御塔被摧毁了' : '摧毁一座敌方防御塔', mine ? C.red : C.gold, { voice: mine ? 'towerLost' : 'towerKill' }); } break;
      case 'dragon': if (!quiet) { const ours = e.team === 0, big = e.mt === 'lord'; announce(`${ours ? '我方' : '敌方'}击败了${big ? '大龙' : '小龙'}`, ours ? C.gold : C.red, { voice: (big ? 'lord' : 'drake') + (ours ? 'B' : 'R'), sub: big ? (ours ? '三条路出现了我方先锋' : '小心敌方先锋') : (ours ? '全队金币 +' + MONSTER.drake.teamGold : '') }); } break;
      case 'dragonSpawn': if (!quiet && W.t > 5) announce(e.mt === 'lord' ? '大龙出现了' : '小龙出现了', '#D8B0FF', { voice: e.mt === 'lord' ? 'lordUp' : 'drakeUp', dur: 2 }); break;
      case 'say': if (!quiet) { if (e.k === 'welcome') announce('欢迎来到峡谷争锋', C.gold, { voice: 'welcome', dur: 2.6 }); else if (e.k === 'five') announce('敌军还有 5 秒到达战场', C.gold, { voice: 'five' }); else if (e.k === 'go') { announce('全军出击', C.gold, { voice: 'go', dur: 1.8 }); sfx('wave'); } } break;
      case 'recall': if (!quiet && me && e.id === me.id) sfx('recall'); break;
      case 'buy': if (!quiet && me && e.id === me.id) { toast('购买了 ' + ITEMS[e.item].name, C.gold2); sfx('coin'); } break;
      case 'respawn': fx3Unit(W, e); break;
      case 'end': R3.shake = 9; break;
    }
  }
  W.ev.length = 0;
}
function killEvent(W, me, e) {
  const k = byId(W, e.k), v = byId(W, e.v);
  if (!v) return;
  HUD.feed.unshift({ k: k ? k.hid : null, kt: 1 - v.team, v: v.hid, vt: v.team, t: 0 });
  const ours = v.team === 1;
  const col = ours ? C.gold : C.red;
  const opt = { k: k ? [k.hid, k.team] : null, v: [v.hid, v.team] };
  sfx('kill', null, null, 0.7);
  if (e.first) announce('第一滴血', col, Object.assign({ voice: 'first' }, opt));
  else if (e.multi >= 2) { const m = MULTI[Math.min(5, e.multi)]; announce(m[0], col, Object.assign({ voice: m[1] }, opt)); }
  else if (e.streak >= 3) { const s = e.streak >= 8 ? ['超神了', 'legend'] : SPREE[e.streak]; announce(s[0], col, Object.assign({ voice: s[1] }, opt)); }
  else if (e.shut) announce('终结', col, Object.assign({ voice: 'shut' }, opt));
  else if (me && k && k.id === me.id) announce('你击败了一个敌人', C.gold, Object.assign({ voice: 'youkill', dur: 2 }, opt));
  else if (me && v.id === me.id) announce('你被击败了', C.red, Object.assign({ voice: 'youdie', dur: 2 }, opt));
  else announce(ours ? '我方击败了敌人' : '敌方击败了我方英雄', col, Object.assign({ dur: 1.6 }, opt));
  if (e.ace) announce('团灭', col, { voice: 'ace', dur: 2, sub: ours ? '趁现在去推塔！' : '守住高地！' });
}

/* ---------- 帧率跟不上：降清晰度，再关实时影子 ---------- */
function perfTick(dt) {
  const P = G.perf;
  if (P.off) return;
  P.t += dt; P.n++;
  if (P.t < 2.5) return;
  const fps = P.n / P.t;
  P.t = 0; P.n = 0;
  if (fps > 45) return;
  if (G.dprGL > 1.01) { G.dprGL = Math.max(1, G.dprGL - 0.25); layout(); }
  else if (S3.sun.castShadow) {
    S3.sun.castShadow = false; S3.r.shadowMap.enabled = false;
    S3.scene.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); });
  } else if (G.dprGL > 0.76) { G.dprGL = Math.max(0.75, G.dprGL - 0.25); layout(); }
}

/* ---------- 主循环 ---------- */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - G.last) / 1000));
  G.last = now;
  if (G.scr === 'boot') return;
  if (G.scr === 'select' && G.sc) { renderShowcase(dt); HUD.g.setTransform(1, 0, 0, 1, 0, 0); HUD.g.clearRect(0, 0, HUD.cv.width, HUD.cv.height); return; }
  const W = G.W;
  if (W && ['game', 'shop', 'pause', 'result', 'vs'].includes(G.scr)) {
    const run = G.scr !== 'vs' && G.scr !== 'result' && !G.paused && !G.rotate;
    if (run) {
      playerCmd(W, G.me);
      G.acc += dt;
      let n = 0;
      while (G.acc >= STEP && n < 4) { step(W, STEP); G.acc -= STEP; n++; }
      if (n === 4) G.acc = 0;
      handleEvents(W, G.me, false);
      perfTick(dt);
    }
    if (W.winner >= 0 && !G.endShown) {
      G.endShown = true;
      const cr = W.units.find(u => u.kind === 'crystal' && u.team !== W.winner);
      R3.peek = cr ? [cr.x, cr.y] : null;
      setTimeout(() => {
        announce(W.winner === 0 ? '胜利' : '失败', W.winner === 0 ? C.gold : C.red, { voice: W.winner === 0 ? 'win' : 'lose', dur: 3, urgent: true });
        sfx(W.winner === 0 ? 'win' : 'lose');
      }, 900);
      setTimeout(() => { R3.peek = null; showResult(); }, 3600);
    }
    AU.camX = R3.camX; AU.camY = R3.camY;
    if (run) ambientTick(dt);
    render3D(W, G.me, G.me, run ? dt : 0, G.scr === 'game' ? INP.aim : null);
    if (G.scr === 'game' || G.scr === 'shop' || G.scr === 'pause') drawHUD(W, G.me, run ? dt : 0, 'game');
    else drawHUD(null, null, 0);
  } else if (G.demo) {
    const D = G.demo;
    G.acc += dt;
    let n = 0;
    while (!G.freeze && G.acc >= 1 / 30 && n < 3) { step(D, 1 / 30); G.acc -= 1 / 30; n++; }
    if (n === 3) G.acc = 0;
    handleEvents(D, null, true);
    G.demoT += dt;
    if (!G.freeze && (G.demoT > 9 || G.demoCam.dead)) {        // 换一个英雄跟拍，挑离敌人最近的（有架打）
      G.demoT = 0;
      let best = null, bd = 1e9;
      for (const h of D._heroes) { if (h.dead) continue; for (const e of D._heroes) if (e.team !== h.team && !e.dead) { const d = dist(h, e); if (d < bd) { bd = d; best = h; } } }
      G.demoCam = best || D._heroes[0];
    }
    if (D.winner >= 0) startDemo();
    render3D(G.demo, G.demoCam, null, G.freeze ? 0 : dt, null);
    drawHUD(G.demo, null, G.freeze ? 0 : dt, 'demo');
  }
}

/* ---------- 启动 ---------- */
function bindInput() {
  const cv = HUD.cv;
  const pos = ev => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  cv.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* 有的浏览器不支持 */ }
    audioInit();
    if (G.scr !== 'game' || G.paused) return;
    const [x, y] = pos(ev);
    onPointerDown(G.W, G.me, ev.pointerId, x, y);
  });
  cv.addEventListener('pointermove', ev => {
    const [x, y] = pos(ev);
    if (ev.pointerType === 'mouse') { INP.mouse = [x, y]; INP.mouseT = R3.t; }
    if (G.scr !== 'game') return;
    onPointerMove(G.W, G.me, ev.pointerId, x, y);
  });
  const up = ev => { if (!G.me) return; onPointerUp(G.W, G.me, ev.pointerId); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', ev => ev.preventDefault());
  window.addEventListener('keydown', ev => {
    if (G.scr === 'game' && !G.paused) {
      if (ev.code === 'KeyP' || ev.code === 'Escape') { openPause(); return; }
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(ev.code)) ev.preventDefault();
      if (!ev.repeat) onKey(G.W, G.me, ev.code, true);
      else INP.keys[ev.code] = true;
    } else if (G.scr === 'pause' && (ev.code === 'KeyP' || ev.code === 'Escape')) closePause();
    else if (G.scr === 'shop' && ev.code === 'Escape') { hideAll(); G.scr = 'game'; }
  });
  window.addEventListener('keyup', ev => { onKey(G.W, G.me, ev.code, false); });
  window.addEventListener('blur', () => { INP.keys = {}; INP.keyAtk = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.scr === 'game' && G.W && G.W.winner < 0) openPause(); });
  INP.onPause = openPause;
  INP.onShop = openShop;
}
// 页面更新（重新发布）时保住正在打的这一局：对局数据是纯 JSON（下划线开头的是缓存，不存）
function snapshotState() {
  const base = { hero: G.hero, diff: G.diff };
  if (!G.W || !G.me || G.W.winner >= 0 || !['game', 'pause', 'shop'].includes(G.scr)) return base;
  try { base.save = JSON.stringify(G.W, (k, v) => (k[0] === '_' ? undefined : v)); base.camX = R3.camX; base.camY = R3.camY; } catch (e) { /* 存不了就不存 */ }
  return base;
}
function restoreGame(data) {
  try {
    const W = JSON.parse(data.save);
    relink(W);
    const me = W.units.find(u => u.isPlayer);
    if (!me) return false;
    reset3D();
    G.W = W; G.me = me; G.demo = null;
    R3.camX = data.camX || me.x; R3.camY = data.camY || me.y;
    G.endShown = false; G.acc = 0; G.crystalWarnT = -99;
    inpReset(); hideAll(); G.scr = 'game';
    openPause();
    return true;
  } catch (e) { return false; }
}
function boot(data) {
  data = data || {};
  const bootTxt = $('#bootTxt');
  if (typeof THREE === 'undefined') { if (bootTxt) bootTxt.textContent = '三维引擎没加载上，请检查网络后刷新。'; return; }
  loadPrefs();
  if (data.hero && HERO_BY_ID[data.hero]) G.hero = data.hero;
  if (data.diff != null) G.diff = data.diff;
  HUD.keyboard = !(('ontouchstart' in window) || navigator.maxTouchPoints > 0);
  G.dprGL = Math.min(window.devicePixelRatio || 1, 2);
  HUD.cv = $('#hud'); HUD.g = HUD.cv.getContext('2d');
  try { initRenderer($('#gl')); } catch (e) { if (bootTxt) bootTxt.textContent = '这个浏览器不支持 WebGL，玩不了三维画面。'; return; }
  layout();
  window.addEventListener('resize', () => setTimeout(layout, 50));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(layout, 50));
  bindInput();
  // 分几步建，中间让“加载中”画出来
  const steps = [
    ['地图', () => { initGrid(); S3.scene = buildScene(); init3D(S3.scene); }],
    ['英雄', () => { const ps = heroPortraits(96); HUD.portraits = ps; for (const id in ps) G.img['h' + id] = ps[id].toDataURL(); }],
    ['界面', () => { HUD.mini = buildMinimap(256); buildShowcase(); buildTitle(); }],
    ['开场', () => { if (!(data.save && restoreGame(data))) { startDemo(); show('title'); } G.last = performance.now(); }],
  ];
  let i = 0;
  const next = () => {
    if (i >= steps.length) return;
    const [nm, fn] = steps[i++];
    if (bootTxt) bootTxt.textContent = '加载中：' + nm + '…';
    setTimeout(() => {
      try { fn(); } catch (e) { if (bootTxt) bootTxt.textContent = '出错了：' + e.message; throw e; }
      next();
    }, 16);
  };
  next();
  requestAnimationFrame(frame);
}
function start(data) {
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', () => boot(data));
  else boot(data);
}
const HOT = window.claude && window.claude.hot;
if (HOT && HOT.snapshot) HOT.snapshot(snapshotState);
if (HOT && HOT.ready) HOT.ready(start); else start((HOT && HOT.data) || {});

</script>
