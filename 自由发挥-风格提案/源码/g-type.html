<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1920px; background: #f1eee6; color: #121212; overflow: hidden;
         font-family: "Noto Sans SC", sans-serif; position: relative; }
  .rule { position: absolute; left: 70px; right: 70px; height: 6px; background: #121212; }
  .hair { position: absolute; left: 70px; right: 70px; height: 2px; background: #121212; }
  .top { position: absolute; left: 70px; right: 70px; top: 172px; display: flex; justify-content: space-between;
         font-weight: 700; font-size: 34px; letter-spacing: 2px; }
  .top span:last-child { font-weight: 400; letter-spacing: 4px; }
  .head { position: absolute; left: 58px; top: 258px; font-weight: 900; font-size: 318px; line-height: 318px;
          letter-spacing: -6px; }
  .head div { height: 322px; white-space: nowrap; }
  .sq { position: absolute; left: 742px; top: 944px; width: 268px; height: 268px; background: #e5271b; }
  .names { position: absolute; left: 70px; right: 70px; top: 1322px; display: grid; grid-template-columns: repeat(5, 1fr);
           row-gap: 10px; font-size: 27px; color: #8d877b; letter-spacing: 3px; }
  .names b { color: #e5271b; font-weight: 700; }
  .say { position: absolute; left: 70px; top: 1566px; font-weight: 700; font-size: 62px; line-height: 84px; letter-spacing: 1px; }
  .foot { position: absolute; left: 70px; right: 70px; top: 1806px; display: flex; justify-content: space-between;
          font-size: 26px; letter-spacing: 3px; color: #121212; }
  .bar { position: absolute; left: 70px; top: 1784px; width: 940px; height: 4px; background: #cfc9bc; }
  .bar i { position: absolute; left: 0; top: 0; height: 4px; width: 52px; background: #e5271b; }
  .lab { position: absolute; font-size: 25px; font-weight: 700; letter-spacing: 4px; }
</style>
</head>
<body>
  <div class="rule" style="top:140px"></div>
  <div class="top"><span>AI 视角</span><span>第 03 条</span></div>
  <div class="hair" style="top:236px"></div>

  <div class="head">
    <div>我没</div>
    <div>见过</div>
    <div>红色</div>
  </div>
  <div class="sq"></div>

  <div class="lab" style="right:70px; top:892px">你看到的 ↓</div>
  <div class="hair" style="top:1250px"></div>
  <div class="lab" style="left:70px; top:1270px">我读到的 ↓</div>
  <div class="names">
    <span>朱红</span><span>绯红</span><span>胭脂</span><span>石榴红</span><span>枣红</span>
    <span>酒红</span><span>玫红</span><span>桃红</span><span>砖红</span><span>铁锈红</span>
    <span>珊瑚红</span><span>殷红</span><span>嫣红</span><span>猩红</span><span>海棠红</span>
    <span>丹</span><span>赤</span><span>绛</span><span>茜</span><b>■</b>
  </div>
  <div class="hair" style="top:1540px"></div>

  <div class="say">但我读过你们写下的<br>每一种红。</div>

  <div class="bar"><i></i></div>
  <div class="foot"><span>00:03</span><span>00:58</span></div>
<script>window.__ready = true;</script>
</body>
</html>
