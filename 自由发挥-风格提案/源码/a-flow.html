<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/300.css">
<style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #03050b; position: relative;
         font-family: "Noto Sans SC", sans-serif; color: #fff; }
  canvas { position: absolute; left: 0; top: 0; }
  .ser { position: absolute; left: 72px; top: 150px; font-weight: 500; font-size: 34px; letter-spacing: 8px; color: #8fd8ff; }
  .ser b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #5ff0c8; margin-right: 18px; vertical-align: 4px;
           box-shadow: 0 0 18px #5ff0c8; }
  .ep { position: absolute; left: 72px; top: 204px; font-weight: 300; font-size: 28px; letter-spacing: 6px; color: #6f86a8; }
  .title { position: absolute; left: 0; width: 1080px; top: 1378px; text-align: center; font-weight: 900; font-size: 150px; letter-spacing: 8px;
           text-shadow: 0 0 60px rgba(90, 200, 255, 0.55); }
  .sub { position: absolute; left: 0; width: 1080px; top: 1582px; text-align: center; font-weight: 300; font-size: 46px; letter-spacing: 6px; color: #cfe9ff; }
  .legend { position: absolute; left: 290px; top: 1716px; width: 500px; }
  .legend .bar { height: 10px; border-radius: 5px;
     background: linear-gradient(90deg, #163caa, #1b86e8, #22d3d0, #86f59c, #ffe45a, #ff6a93, #ffd6e8); }
  .legend .lab { display: flex; justify-content: space-between; margin-top: 14px; font-weight: 300; font-size: 26px; letter-spacing: 4px; color: #8ea3c0; }
  .you { position: absolute; font-weight: 500; font-size: 30px; letter-spacing: 3px; color: #fff; white-space: nowrap;
         text-shadow: 0 0 12px #000, 0 0 12px #000, 0 0 24px #000; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ser"><b></b>看不见的东西</div>
<div class="ep">第 1 集 · 风</div>
<div class="you" id="you">你在这儿</div>
<div class="title">如果风有颜色</div>
<div class="sub">你头顶的天空，一直在这样流</div>
<div class="legend"><div class="bar"></div><div class="lab"><span>风小</span><span>风大</span></div></div>

<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script>
let seed = 4242;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
const W = 1080, H = 1920, D2R = Math.PI / 180;
const ctx = document.getElementById('c').getContext('2d');
const CX = 540, CY = 800, R = 452;
const L0 = 128 * D2R, P0 = 24 * D2R;        // 视角中心：西太平洋上空
const sP0 = Math.sin(P0), cP0 = Math.cos(P0);

function proj(lon, lat) {
  const dl = lon - L0, cl = Math.cos(lat), sl = Math.sin(lat);
  const z = sP0 * sl + cP0 * cl * Math.cos(dl);
  return [CX + R * cl * Math.sin(dl), CY - R * (cP0 * sl - sP0 * cl * Math.cos(dl)), z];
}
function inv(x, y) {
  const px = (x - CX) / R, py = -(y - CY) / R, rho = Math.hypot(px, py);
  if (rho > 1) return null;
  const c = Math.asin(rho), sc = Math.sin(c), cc = Math.cos(c);
  const lat = Math.asin(cc * sP0 + (rho ? py * sc * cP0 / rho : 0));
  const lon = L0 + Math.atan2(px * sc, rho * cP0 * cc - py * sP0 * sc);
  return [lon, lat];
}

// ---------- 风场（示意用，不是真实数据） ----------
const vort = [
  // 经度, 纬度, 强度, 半径(度), 旋向(北半球气旋逆时针 = +1)
  [136, 19, 34, 3.2, 1],     // 台风
  [168, 46, 20, 7.5, 1],
  [98, 52, 15, 8, 1],
  [150, -32, 20, 7, -1],
  [92, -42, 17, 8, -1],
  [178, 8, 11, 5, 1],
  [118, 36, 9, 9, -1],       // 高压，顺时针
  [200, 30, 12, 12, -1],
];
function wind(lon, lat) {
  const ld = lon / D2R, pd = lat / D2R;
  let u = -8.5 * Math.cos(3.6 * lat);
  let v = 5.5 * Math.sin(5 * lon + 0.6) * Math.exp(-Math.pow((Math.abs(pd) - 48) / 17, 2)) * (pd > 0 ? 1 : -1);
  u += 2.6 * Math.sin(3 * lon + 1.3) * Math.sin(5 * lat + 0.7) + 1.9 * Math.sin(7 * lon - 2 * lat + 2.1) + 1.2 * Math.sin(13 * lon + 9 * lat);
  v += 2.6 * Math.cos(4 * lon + 0.4) * Math.sin(6 * lat) + 1.6 * Math.sin(9 * lon + 3 * lat + 1.0) + 1.1 * Math.cos(15 * lon - 7 * lat + 0.5);
  const cl = Math.cos(lat);
  for (const [vl, vp, S, r0, sg] of vort) {
    let dx = (ld - vl); if (dx > 180) dx -= 360; if (dx < -180) dx += 360;
    dx *= cl; const dy = pd - vp, r = Math.hypot(dx, dy) + 1e-6;
    const q = r / r0, vt = S * q * Math.exp(1 - q);
    const inflow = sg > 0 || vp < 0 ? 0.12 : -0.06;
    u += sg * (-vt * dy / r) - inflow * vt * dx / r;
    v += sg * (vt * dx / r) - inflow * vt * dy / r;
  }
  return [u, v];
}

// ---------- 颜色 ----------
const stops = [[0, [22, 60, 170]], [3.5, [27, 134, 232]], [6.5, [34, 211, 208]], [9.5, [134, 245, 156]], [13, [255, 228, 90]], [18, [255, 106, 147]], [27, [255, 214, 232]]];
function color(s) {
  for (let i = 1; i < stops.length; i++) if (s <= stops[i][0]) {
    const t = (s - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]), a = stops[i - 1][1], b = stops[i][1];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  return [255, 214, 232];
}

async function main() {
  // 底：星空
  ctx.fillStyle = '#03050b'; ctx.fillRect(0, 0, W, H);
  const neb = ctx.createRadialGradient(CX, CY, R * 0.6, CX, CY, R * 2.4);
  neb.addColorStop(0, 'rgba(24, 60, 120, 0.42)'); neb.addColorStop(0.5, 'rgba(12, 22, 56, 0.2)'); neb.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 520; i++) {
    const x = rr(0, W), y = rr(0, H), s = Math.pow(rnd(), 3) * 1.9 + 0.4;
    ctx.fillStyle = `rgba(${200 + rr(0, 55) | 0}, ${215 + rr(0, 40) | 0}, 255, ${rr(0.15, 0.85)})`;
    ctx.beginPath(); ctx.arc(x, y, s, 0, 6.2832); ctx.fill();
  }
  // 大气辉光
  const halo = ctx.createRadialGradient(CX, CY, R * 0.96, CX, CY, R * 1.2);
  halo.addColorStop(0, 'rgba(80, 190, 255, 0.62)'); halo.addColorStop(0.25, 'rgba(60, 150, 255, 0.22)'); halo.addColorStop(1, 'rgba(40, 100, 255, 0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(CX, CY, R * 1.2, 0, 6.2832); ctx.fill();
  // 球体
  const body = ctx.createRadialGradient(CX - R * 0.3, CY - R * 0.35, R * 0.1, CX, CY, R);
  body.addColorStop(0, '#0d1b38'); body.addColorStop(0.7, '#081022'); body.addColorStop(1, '#040813');
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.fill();

  // 陆地和经纬网
  const topo = await (await fetch('node_modules/world-atlas/land-110m.json')).json();
  const land = topojson.feature(topo, topo.objects.land);
  const pr = d3.geoOrthographic().scale(R).translate([CX, CY]).rotate([-L0 / D2R, -P0 / D2R]).clipAngle(90);
  const path = d3.geoPath(pr, ctx);
  ctx.beginPath(); path(d3.geoGraticule().step([20, 20])());
  ctx.strokeStyle = 'rgba(120, 170, 255, 0.10)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); path(land);
  ctx.fillStyle = 'rgba(150, 190, 255, 0.085)'; ctx.fill();

  // ---------- 粒子流线 ----------
  ctx.save();
  ctx.beginPath(); ctx.arc(CX, CY, R - 1, 0, 6.2832); ctx.clip();
  ctx.lineCap = 'round';
  const NP = 15000;
  for (let i = 0; i < NP; i++) {
    const a = rr(0, 6.2832), rad = Math.sqrt(rnd()) * R * 0.995;
    const ll = inv(CX + Math.cos(a) * rad, CY + Math.sin(a) * rad);
    if (!ll) continue;
    let [lon, lat] = ll;
    const steps = 40 + (rnd() * 70 | 0);
    let p = proj(lon, lat);
    const lum = rnd() < 0.12 ? rr(1.0, 1.25) : rr(0.28, 0.9);      // 每条线亮度不一样，叠起来才有丝的质感
    for (let k = 0; k < steps; k++) {
      const [u, v] = wind(lon, lat);
      const sp = Math.hypot(u, v);
      if (sp < 0.08) break;
      const ang = (1.15 + 1.9 * Math.tanh(sp / 13)) / R;                      // 每一步在屏幕上走 1~3 像素，快的地方也留得住纹理
      lon += u / sp * ang / Math.max(0.2, Math.cos(lat)); lat += v / sp * ang;
      if (Math.abs(lat) > 1.5) break;
      const q = proj(lon, lat);
      if (q[2] < 0.02) break;
      const f = k / steps, fade = Math.sin(Math.PI * Math.pow(f, 0.7));     // 头亮尾暗
      const limb = 0.35 + 0.65 * Math.pow(q[2], 0.6);                         // 靠近边缘暗一点
      const [r, g, b] = color(sp);
      ctx.strokeStyle = `rgba(${Math.min(255, r * lum) | 0},${Math.min(255, g * lum) | 0},${Math.min(255, b * lum) | 0},${((0.5 + 0.3 * Math.tanh(sp / 13)) * fade * limb).toFixed(3)})`;
      ctx.lineWidth = 1.0 + 0.7 * Math.tanh(sp / 13);
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
      p = q;
    }
  }
  ctx.restore();

  // 辉光：把流线模糊一份再叠亮
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const oc = off.getContext('2d');
  oc.save(); oc.beginPath(); oc.arc(CX, CY, R, 0, 6.2832); oc.clip(); oc.drawImage(ctx.canvas, 0, 0); oc.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.clip();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3; ctx.filter = 'blur(10px)';
  ctx.drawImage(off, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // 海岸线描在流线上面
  ctx.beginPath(); path(land);
  ctx.strokeStyle = 'rgba(235, 245, 255, 0.5)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();

  // 球体暗面（右下压暗一点，出体积感）
  const shade = ctx.createRadialGradient(CX - R * 0.22, CY - R * 0.26, R * 0.3, CX, CY, R * 1.02);
  shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(0.6, 'rgba(0,0,10,0.10)'); shade.addColorStop(1, 'rgba(0,0,12,0.66)');
  ctx.fillStyle = shade; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.fill();
  // 边缘亮线
  ctx.strokeStyle = 'rgba(140, 215, 255, 0.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.stroke();

  // "你在这儿"
  const you = proj(113 * D2R, 31 * D2R);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(you[0], you[1], 7, 0, 6.2832); ctx.fill();
  for (const [rad, al] of [[18, 0.8], [32, 0.4], [48, 0.18]]) {
    ctx.strokeStyle = `rgba(255,255,255,${al})`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(you[0], you[1], rad, 0, 6.2832); ctx.stroke();
  }
  const el = document.getElementById('you');
  el.style.left = (you[0] - 168) + 'px'; el.style.top = (you[1] - 72) + 'px';

  // 暗角
  const vg = ctx.createRadialGradient(540, 900, 600, 540, 960, 1250);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  await document.fonts.load('900 100px "Noto Sans SC"', '如果风有颜色');
  window.__ready = true;
}
main();
</script>
</body>
</html>
