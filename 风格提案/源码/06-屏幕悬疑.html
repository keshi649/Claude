<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  body { background: #0b0c10; font-family: "Noto Sans SC", sans-serif; color: #ececf1; position: relative; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 96px; display: flex; align-items: center; justify-content: space-between; padding: 14px 64px 0; box-sizing: border-box; font-weight: 700; font-size: 38px; letter-spacing: 1px; }
  .status .r { display: flex; align-items: center; gap: 16px; }
  .head { position: absolute; left: 0; right: 0; top: 96px; height: 150px; display: flex; align-items: center; padding: 0 44px; box-sizing: border-box; border-bottom: 2px solid #1b1d24; background: #0f1015; }
  .head .back { width: 30px; height: 30px; border-left: 6px solid #8f93a3; border-bottom: 6px solid #8f93a3; transform: rotate(45deg); margin: 0 34px 0 16px; }
  .ava { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(140deg, #f3b27a, #d96a5a); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 44px; color: #fff7ee; flex: none; }
  .head .who { margin-left: 26px; }
  .head .who b { display: block; font-size: 44px; font-weight: 700; }
  .head .who span { display: block; font-size: 28px; color: #6fd08c; margin-top: 4px; }
  .chat { position: absolute; left: 0; right: 0; top: 246px; bottom: 300px; padding: 286px 40px 0; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
  .ts { align-self: center; font-size: 26px; color: #6b6f7d; margin: 14px 0 10px; letter-spacing: 2px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .row.me { justify-content: flex-end; }
  .row .ava { width: 76px; height: 76px; font-size: 36px; }
  .row .gap { width: 76px; flex: none; }
  .b { max-width: 700px; padding: 21px 36px; border-radius: 40px; font-size: 46px; line-height: 1.38; font-weight: 500; letter-spacing: 1px; }
  .them .b { background: #23262f; border-bottom-left-radius: 12px; }
  .me .b { background: #3d5afe; color: #fff; border-bottom-right-radius: 12px; }
  .read { align-self: flex-end; font-size: 24px; color: #6b6f7d; margin: -4px 12px 6px 0; }
  .last .b { background: #2a2d37; box-shadow: 0 0 0 2px rgba(255,255,255,.06), 0 18px 60px rgba(0,0,0,.6); font-weight: 700; }
  .typing .b { padding: 30px 38px; display: flex; gap: 14px; }
  .typing i { width: 18px; height: 18px; border-radius: 50%; background: #8f93a3; display: block; }
  .typing i:nth-child(2) { opacity: .65; transform: translateY(-8px); } .typing i:nth-child(3) { opacity: .35; }
  .input { position: absolute; left: 0; right: 0; bottom: 150px; height: 150px; background: #0f1015; border-top: 2px solid #1b1d24; display: flex; align-items: center; padding: 0 40px; gap: 26px; box-sizing: border-box; }
  .field { flex: 1; height: 96px; border-radius: 48px; background: #1b1d24; display: flex; align-items: center; padding: 0 40px; font-size: 44px; }
  .field u { display: inline-block; width: 4px; height: 54px; background: #6d86ff; margin-left: 6px; text-decoration: none; }
  .send { width: 96px; height: 96px; border-radius: 50%; background: #3d5afe; display: flex; align-items: center; justify-content: center; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; display: flex; align-items: center; justify-content: center; gap: 22px; font-family: "Noto Serif SC", serif; font-size: 30px; letter-spacing: 12px; color: #7d8190; }
  .foot b { color: #e25d4a; font-weight: 700; letter-spacing: 12px; }
  .foot i { width: 56px; height: 2px; background: #3a3d48; display: block; }
  /* 顶上滑下来的通知 */
  .note { position: absolute; left: 30px; right: 30px; top: 258px; border-radius: 48px; background: rgba(46,48,58,.96); padding: 34px 36px; box-sizing: border-box; display: flex; gap: 30px; align-items: center;
          box-shadow: 0 40px 120px rgba(0,0,0,.85), 0 0 0 2px rgba(255,255,255,.07), 0 0 140px rgba(226,93,74,.22); }
  .note .ico { width: 104px; height: 104px; border-radius: 26px; background: linear-gradient(150deg, #ff9b54, #e2553f); flex: none; display: flex; align-items: center; justify-content: center; }
  .note .tx { flex: 1; }
  .note .t1 { display: flex; justify-content: space-between; font-size: 30px; color: #a3a7b6; letter-spacing: 2px; }
  .note .t2 { font-size: 46px; font-weight: 700; margin-top: 6px; }
  .note .t3 { font-size: 38px; color: #d5d7e0; margin-top: 6px; }
  .note .t3 em { font-style: normal; color: #ff8a70; font-weight: 700; }
  .cam { width: 190px; height: 190px; border-radius: 28px; flex: none; position: relative; overflow: hidden;
         background: radial-gradient(ellipse 70% 60% at 50% 18%, #b8c2b0 0%, #6f7a6c 30%, #2a302b 62%, #0c0e0d 100%); }
  .cam:before { content: ""; position: absolute; left: 50%; top: 40px; width: 62px; height: 70px; margin-left: -31px; border-radius: 50% 50% 46% 46%; background: #070807; }
  .cam:after { content: ""; position: absolute; left: 50%; top: 100px; width: 150px; height: 130px; margin-left: -75px; border-radius: 60px 60px 0 0; background: #070807; }
  .cam span { position: absolute; left: 12px; bottom: 8px; font-size: 18px; font-family: monospace; color: #e8ffe8; z-index: 2; letter-spacing: 1px; }
  .cam b { position: absolute; right: 12px; top: 12px; width: 14px; height: 14px; border-radius: 50%; background: #ff3b30; z-index: 2; box-shadow: 0 0 10px #ff3b30; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); pointer-events: none; }
  .grain { position: absolute; inset: 0; opacity: .09; pointer-events: none; }
</style>
