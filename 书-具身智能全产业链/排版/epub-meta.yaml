description: 从 1961 年的第一台工业机器人到 2026 年的机器人基础模型，把具身智能的技术谱系、机器、部件、供应链、模型、应用场景和全球公司放进同一张地图，并给每个产品标出它走到了哪一步：研究、演示、测试、试点、订单、交付，还是规模运营。资料截至 2026 年 11 月 7 日。
